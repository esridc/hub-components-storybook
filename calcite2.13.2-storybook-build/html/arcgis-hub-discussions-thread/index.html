<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Hub Components: Discussions Thread</title>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      calcite-notice {
        margin-top: 4rem;
      }

      .threads {
        background-color: gray;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        column-gap: 0.5rem;
        row-gap: 0.5rem;
        padding: 0.5rem;
        height: calc(100vh - 5rem);
        margin-top: 4rem;
      }

      .thread {
        background-color: #fff;
        position: relative;
        height: calc(100% - 1rem);
        overflow: auto;
        padding: 0.5rem;
      }

      .thread h5 {
        font-size: 16px;
        margin: 0;
        padding: 5px;
        position: absolute;
        top: 0;
        right: 0;
        z-index: 401;
        background-color: #eee;
        border: solid 1px #666;
        border-radius: 0 0 0 5px;
        opacity: 0.5;
      }

      .auth-form {
        width: 400px;
        margin: 50px auto !important;
      }
    </style>
    <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />

    <script type="importmap">
      {
        "imports": {
          "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
        }
      }
    </script>
    <script type="module" src="../../build/hub-components.esm.js"></script>
    <script nomodule src="../../build/hub-components.js"></script>
    <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
    <link rel="stylesheet" href="../calcite-web.min.css" />
  </head>
  <body>
    <script src="https://unpkg.com/@esri/arcgis-rest-request@3.4.3/dist/umd/request.umd.min.js"></script>
    <script src="https://unpkg.com/@esri/arcgis-rest-auth@3.4.3/dist/umd/auth.umd.min.js"></script>
    <arcgis-app-identity client-id="EF9uxuFlOrgf7WpI" redirect-uri="http://localhost:3333/html/redirect.html" portal="https://qaext.arcgis.com"> </arcgis-app-identity>
    <harness-header page-title="Discussion Thread"></harness-header>
    <calcite-notice open kind="info" scale="s" width="full" icon>
      <div slot="message">This component requires authentication to render. Please auth as juliana_pa on QA.</div>
    </calcite-notice>
    <script>
      function createThreads() {
        const editorCfgs = [
          {
            title: 'Post & Replies',
            discussion: 'hub://content/58de591989fa47989c03ecada1dcb061',
            channelId: '5bec7aa49b74467b8fcb4b19e9dbcf31',
            parentId: '5e885ad862c04d549a1fc66e9e7ae533',
          },
          {
            title: 'Deleted Post & Replies',
            discussion: 'hub://content/58de591989fa47989c03ecada1dcb061',
            channelId: '5bec7aa49b74467b8fcb4b19e9dbcf31',
            parentId: 'caaf92b5b30a4911a7c822918c550d16',
          },
          {
            title: 'Post & Reply',
            discussion: 'hub://content/58de591989fa47989c03ecada1dcb061',
            channelId: '5bec7aa49b74467b8fcb4b19e9dbcf31',
            parentId: '5e885ad862c04d549a1fc66e9e7ae533',
            postId: 'a4b03bae3e0b409e90270abe6fe90ecf',
          },
          {
            title: 'Deleted Post & Reply',
            discussion: 'hub://content/58de591989fa47989c03ecada1dcb061',
            channelId: '5bec7aa49b74467b8fcb4b19e9dbcf31',
            parentId: 'caaf92b5b30a4911a7c822918c550d16',
            postId: '6ade90f907ba4709a051ffb2482ba241',
          },
          {
            title: 'Post & Deleted Reply',
            discussion: 'hub://content/58de591989fa47989c03ecada1dcb061',
            channelId: '5bec7aa49b74467b8fcb4b19e9dbcf31',
            parentId: '5e885ad862c04d549a1fc66e9e7ae533',
            postId: '61fdd53f00d04da4a421e4f15f492921',
          },
          {
            title: 'Deleted Thread',
            discussion: 'hub://content/58de591989fa47989c03ecada1dcb061',
            channelId: '5bec7aa49b74467b8fcb4b19e9dbcf31',
            parentId: 'caaf92b5b30a4911a7c822918c550d16',
            postId: '03a055c0222242658f66aa22b89dbf90',
          },
          {
            title: 'Deleted Channel',
            discussion: 'hub://content/58de591989fa47989c03ecada1dcb061',
            channelId: 'd53dd36eb4034ccd9bd7e2d2580a0033',
            parentId: '180cab7e3f5343ce9c6251b2fee044d9',
          },
        ];
        let container = document.querySelector('.threads');
        if (!container) {
          container = document.createElement('div');
          container.className = 'threads';
          editorCfgs.forEach(({ title, postId, parentId, channelId, discussion }) => {
            const threadDiv = document.createElement('div');
            threadDiv.className = 'thread';
            const header = document.createElement('h5');
            header.innerText = title;
            const arcgisThread = document.createElement('arcgis-hub-discussions-thread');
            Object.assign(arcgisThread, {
              postId,
              parentId,
              channelId,
              discussion,
              isHub: false,
            });
            threadDiv.appendChild(header);
            threadDiv.appendChild(arcgisThread);
            container.appendChild(threadDiv);
          });
          document.body.appendChild(container);
          document.body.addEventListener('hubTelemetry', function (evt) {
            console.log('hubTelemetry:', evt.detail);
          });
        }
      }

      createThreads();
    </script>
  </body>
</html>
