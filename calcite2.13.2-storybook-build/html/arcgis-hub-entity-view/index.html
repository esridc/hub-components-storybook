<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entity View Harness</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
  </style>

  <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>
  <!-- load chart components -->
  <!-- NOTE: you will need to add this to any story that uses arcgis-hub-chart -->
  <link rel="stylesheet" href="../../arcgis-charts-components/arcgis-charts-components.css" />
  <script type="module" src="../../arcgis-charts-components/arcgis-charts-components.esm.js"></script>
  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
  <script type="module" src="../../calcite/calcite.esm.js"></script>
  <link rel="stylesheet" href="../calcite-web.min.css" />
</head>

<body>
  <harness-header page-title="Entity View Harness"></harness-header>
  <div class="grid-container padding-leader-4">

    <!-- ArcGIS ASSISTANT + WORKSPACE BUTTONS -->
    <div class="column-24 trailer-1">
      <calcite-button
        appearance="outline-fill"
        href="#"
        icon-start="gear"
        id="workspace-button"
        round>
        Open in Workspace Harness
      </calcite-button>
      <calcite-button
        appearance="outline-fill"
        href="#"
        icon-start="arcgis-online"
        id="arcgis-assistant-button"
        round
        target="_blank">
        Open in ArcGIS Assistant
      </calcite-button>
    </div>

    <!-- (OPTIONAL) ENTITY IDENTIFIER + TYPE INPUTs -->
    <div class="column-24 trailer-1">
      <calcite-label>
        <i>Default items are owned by <strong>paige_pa</strong> on QA. Optionally provide a different entity identifier + type to render the view for:</i>
        <harness-fetch
          entity-prop="entity"
          type="site"
          identifier="62b7be7ae93943f5bb5d13310baf435f"
          show-identifier-input
          show-type-input>

          <!-- ENTITY VIEW -->
          <arcgis-hub-entity-view />

        </harness-fetch>
      </calcite-label>
    </div>
  </div>

  <script>
    const DEFAULT_IDENTIFIERS = {
      project: "d2ed6efbc9904fbc93ff87d0546dfe09", // paige_pa
      initiative: "314cb22b01764e3f9f77b91e7a5673d2", // paige_pa
      site: "62b7be7ae93943f5bb5d13310baf435f", // paige_pa
      discussion: "b0e29cd593e14928bed3b08715cb188c",  // paige_pa
      content: "149a98f532194836a1fac77c71a495ab", // paige_pa
      group: "092dc5cdb2ed4c4788dc671aee67a4f5",   // paige_pa
      page: "64fa07dd9b2f4e64b9800e86d6afc9eb",     // paige_pa
      initiativeTemplate: "7993c71c03b44956a9d86768d14267c5", // paige_pa
      survey: "7f844088be7d44a09f67b0f991b975b5", //paige_pa
      template: "2098f09abe314cfaa0319be9a6245790", // qa_pre_a_hub_admin
      event: "clyegwbsz004x6q01866nq5cr", // paige_pa
    };


    // INITIALIZE THE HARNESS ON LOAD
    const initHarness = () => {
      // 0. set the entity identifier defaults on the harness fetch component
      const harnessFetch = document.querySelector('harness-fetch');
      harnessFetch.defaults = DEFAULT_IDENTIFIERS;

      // 1. get the entity query params from the URL
      const params = new URL(window.location).searchParams;
      const type = params.get('type') || 'site';
      const identifier = params.get('identifier') || DEFAULT_IDENTIFIERS[type];

      // 2. update the harness header
      const harnessHeader = document.querySelector('harness-header');
      harnessHeader.pageTitle = `${type[0].toUpperCase() + type.slice(1)} View Harness`

      // 3. update the identifier + type inputs
      harnessFetch.identifier = identifier;
      harnessFetch.type = type;

      // 4. update the Workspace button href
      const url = new URL(window.location);
      const workspaceHref = `${url.origin}/html/arcgis-hub-workspace/entity-workspace-harness.html?type=${type || "site"}&identifier=${identifier || DEFAULT_IDENTIFIERS.site}`
      document.querySelector("#workspace-button").setAttribute("href", workspaceHref);

      // 5. update the ArcGIS Assistant button href
      const assistantHref = `https://assistantqa.esri-ps.com/item/${identifier}/json/description?queryScope=USER`;
      document.querySelector("#arcgis-assistant-button").setAttribute("href", assistantHref);
    }

    initHarness();

    // LISTEN FOR GALLERY CARD CLICKS (redirect to relevant entity view)
    document.addEventListener('arcgisHubCardTitleLinkClick', evt => {
      evt.detail.event.preventDefault();
      const identifier = evt.detail.model.id;
      const type = getEntityType(evt.detail.model.type);

      appendParams({ type, identifier });
    });

    // VIEW EVENT LISTENERS (logged to console for development purposes)
    document.body.addEventListener('hubTelemetry', function (evt) {
      console.log('hubTelemetry:', evt.detail);
    });

    // HELPER TO SET PROPS ON VIEW COMPONENT
    function setProp(key, value) {
      const el = document.querySelector('arcgis-hub-entity-view');
      el[key] = value;
    }

    // HELPER (COPIED FROM HUB.JS) TO GET ENTITY TYPE FROM ITEM TYPE
    function getEntityType(type) {
      let entityType;
      switch (type) {
        case "Hub Site Application":
        case "Site Application":
          entityType = "site";
          break;
        case "Hub Page":
        case "Site Page":
          entityType = "page";
          break;
        case "Hub Project":
          entityType = "project";
          break;
        case "Hub Initiative":
          entityType = "initiative";
          break;
        case "Discussion":
          entityType = "discussion";
          break;
        case "Solution":
          entityType = "template";
          break;
        case "Group":
          entityType = "group";
          break;
        case "Form":
          entityType = "survey";
          break;
        case "Hub Initiative Template":
          entityType = "initiativeTemplate";
          break;
        case "Event":
          entityType = "event";
          break;
        default:
          entityType = "content";
      }
      return entityType;
    }

    // HELPER TO APPEND TYPE + IDENTIFIER AS QUERY PARAMS ON URL
    const appendParams = (params) => {
      const url = new URL(window.location);

      Object.entries(params).forEach(([key, value]) => {
        url.searchParams.set(key, value);
      });
      window.location.search = url.search;
    }
  </script>
</body>

</html>
