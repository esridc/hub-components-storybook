<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>Hub Components: Simple Gallery</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }

    .nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
  </style>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
  <link rel="stylesheet" href="../calcite-web.min.css">

  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>
  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <script type="module" src="../../calcite/calcite.esm.js"></script>
</head>

<body>
  <div class="grid-container padding-leader-2">
    <div class="column-20 trailer-2 header">
      <calcite-button scale="l" href="/">Home</calcite-button>
      <h2>arcgis-hub-gallery: state</h2>
    </div>
    <div class="column-20">
      <calcite-button onClick="signIn()">Sign In</calcite-button>
      <calcite-button onClick="signOut()">Sign Out</calcite-button>
      <div id="userinfo"></div>
      <span id="params"></span>
      <calcite-input clearable id="qs">
        <calcite-button slot="action" onClick="applyParams()">Apply</calcite-button>
      </calcite-input>
      <calcite-radio-group>
        <calcite-radio-group-item value="arcgis" checked>Portal API</calcite-radio-group-item>
        <calcite-radio-group-item value="arcgis-hub">Hub API</calcite-radio-group-item>
      </calcite-radio-group>

      <br>

      <arcgis-hub-gallery term='hub' layout='list' limit='9' api-url="https://devext.arcgis.com" api-type="arcgis"
        show-thumbnail show-search show-sort show-chips show-facets show-more-results-btn selectable gallery-type="item">

      </arcgis-hub-gallery>

      <arcgis-app-identity client-id="zhGPGlPQaq11eIQC" redirect-uri="http://localhost:3333/html/redirect.html"
        portal="https://devext.arcgis.com">
      </arcgis-app-identity>
    </div>


  </div>
  <script>

    // APPIds
    // DEVEXT: zhGPGlPQaq11eIQC / 906e855bb18b4cf49031482c0c117f09
    // QAEXT:  u3KZUyh6wbCQtuCj / ???

    document.addEventListener('calciteRadioGroupChange', (evt) => {
      console.log(`Changing API to ${evt.detail}`);
      const apiType = evt.detail;
      setProp('apiType', apiType);
    });
    document.addEventListener('arcgisHubGalleryAction', (evt) => {
      console.log(`galleryAction: ${evt.detail.action} for ${evt.detail.model.id}`);
    })
    function applyParams() {
      const paramString = document.getElementById('qs').value;
      const parts = paramString.split("&");
      const params = parts.reduce((acc, entry) => {
        if (entry) {
          const [key, val] = entry.split("=");
          if (val !== "null") {
            acc[key] = val;
          }
        }
        return acc;
      }, {});

      setProp("state", params);
    }
    // These would be raised from some user profile type control
    function signIn() {
      const evt = new CustomEvent('arcgisAppIdentityStartSignIn')
      document.dispatchEvent(evt);
    }
    function signOut() {
      const evt = new CustomEvent('arcgisAppIdentityStartSignOut')
      document.dispatchEvent(evt);
    }

    // These listeners could be in any component that wants a session
    document.addEventListener('arcgisAppIdentitySignedIn', (evt) => {
      setProp('context', evt.detail);
      showUserInfo(evt.detail.session);
    });

    document.addEventListener('arcgisAppIdentitySignedOut', (evt) => {
      setProp('context', evt.detail);
      showUserInfo(evt.detail.session);
    });

    const params = {};

    document.addEventListener('arcgisHubGalleryStateChange', (evt) => {
      console.dir(evt.detail);
      showParams(evt.detail);
    });

    function showParams(params) {
      // serialize
      let qs = "";
      for (key in params) {
        if (params[key]) {
          qs = `${qs}&${key}=${params[key]}`
        }

      }
      const el = document.getElementById('params');
      el.innerText = `State as params: ${qs}`;
    }

    // Simple function to so something when auth changes
    function showUserInfo(session) {
      const el = document.getElementById('userinfo');
      if (session) {
        el.innerText = `User ${session.username} authenticated`;
      } else {
        el.innerText = 'No user authenticated';
      }
    }


    // Set a property on the element
    function setProp(key, value) {
      const el = document.querySelector("arcgis-hub-gallery");
      el[key] = value;
    }

    const query = {
      targetEntity: "item",
      filters: [
        {
          predicates: [{orgid: "6yFNtz2GHg0wHfGr"}]
        }
      ]
    };

    const facets = [
      {
        label: 'Modified',
        key: 'modified',
        display: 'date-range',
        state: 'open',
        field: 'modified',
        max: new Date(),
      },
      {
        label: 'Created',
        key: 'created',
        display: 'date-range',
        state: 'open',
        field: 'created',
        max: new Date(),
      },
        {
          label: "Access",
          key: "access",
          display: "multi-select",
          operation: "OR",
          options: [
            {
              label: "Public",
              key: "public",
              selected: true,
              predicates: [{
                access: "public",
              }],
            },
            {
              label: "Shared",
              key: "shared",
              selected: false,
              predicates: [{

                access: "shared",
              },]
            },
            {
              label: "Org",
              key: "org",
              selected: false,
              predicates: [{
                access: "org",
              }],
            },
            {
              label: "Mine",
              key: "mine",
              selected: false,
              predicates: [{
                owner: "dbouwman_dc",
              }],
            }
          ],
        },

        {
          label: "Types",
          key: "types",
          display: "multi-select",
          pageSize: 4,
          operation: "OR",
          options: [
            {
              label: "Projects",
              key: "projects",
              selected: true,
              predicates: [
                {

                  type: "Hub Project"
                }
              ]
            },
            {
              label: "Web Maps",
              key: "webmaps",
              selected: false,
              predicates: [{

                type: "Web Map"
              }]
            },
            {
              label: "Sites",
              key: "sites",
              selected: true,
              predicates: [{

                type: "Hub Site Application"
              }]
            },
            {
              label: "Services",
              key: "services",
              selected: false,
              predicates: [{

                type: ["Feature Service", "Map Service"]
              }]
            },
            {
              label: "Apps",
              key: "apps",
              selected: false,
              predicates: [{

                type: {
                  any: [
                    "Code Sample",
                    "Web Mapping Application",
                    "Mobile Application",
                    "Application",
                    "Desktop Application Template",
                    "Desktop Application",
                    "Operation View",
                    "Dashboard",
                    "Operations Dashboard Extension",
                    "Workforce Project",
                    "Insights Workbook",
                    "Insights Page",
                    "Insights Model",
                    "Hub Page",
                    "Hub Initiative",
                    "Hub Site Application",
                    "StoryMap",
                    "Web Experience",
                    "Web Experience Template",
                    "Form",
                  ],
                  not: [
                    "Code Attachment",
                    "Featured Items",
                    "Symbol Set",
                    "Color Set",
                    "Windows Viewer Add In",
                    "Windows Viewer Configuration",
                    "Map Area",
                    "Indoors Map Configuration",
                  ],
                },
                typekeywords: {
                  not: ["MapAreaPackage", "SMX"],
                },
              }]
            },
            {
              label: "Story Maps",
              key: "storymaps",
              selected: false,
              operation: "OR",
              predicates: [
                {

                  type: "StoryMap",
                },
                {
                  type: "Web Mapping Application",
                  typekeywords: "Story Map",
                }
              ]
            },
            {
              label: "Dashboards",
              key: "dashboards",
              selected: false,
              predicates: [{

                type: "Dashboard",
                typekeywords: {
                  any: ["Dashboard"],
                  not: ["ArcGIS Operation View", "Add In", "Extension"],
                },
              }]
            },
            {
              label: "Document",
              key: "documents",
              selected: false,
              predicates: [{

                typekeywords: {
                  any: ["Document"],
                  not: ["MapAreaPackage", "SMX"],
                },
                type: {
                  any: [
                    "Image",
                    "Layout",
                    "Desktop Style",
                    "Project Template",
                    "Report Template",
                    "Pro Report",
                    "Statistical Data Collection",
                    "360 VR Experience",
                    "netCDF",
                    "PDF",
                    "CSV",
                    "Administrative Report",
                    "Raster function template",
                  ],
                  not: [
                    "Image Service",
                    "Explorer Document",
                    "Explorer Map",
                    "Globe Document",
                    "Scene Document",
                    "Code Attachment",
                    "Featured Items",
                    "Symbol Set",
                    "ColorSet",
                    "Windows Viewer Add In",
                    "Windows Viewer Configuration",
                    "Map Area",
                    "Indoors Map Configuration",
                  ],
                },
              }]
            },

          ]
        },
        {
          label: "Tags",
          key: "tags",
          field: "tags",
          aggLimit: 15,
          operation: "AND",
          display: "multi-select",
          options: []
        }
      ]

    // Pre-selected gallery entities
    const gallerySelection = {
      item: ["665bed9402e3483490a693d817639c5b", "0689eb7edc4a49bf956708e3d795c414"],
      group: [],
      user: [],
      groupMember: [],
      event: []
    }

    setProp("query", query);
    setProp("facets", facets);
    setProp("gallerySelection", gallerySelection);
  </script>
</body>

</html>
