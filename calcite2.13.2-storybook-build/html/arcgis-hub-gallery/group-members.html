<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>Group Members Gallery</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }

    .nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
  </style>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
  <link rel="stylesheet" href="../calcite-web.min.css">

  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>
  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <script type="module" src="../../calcite/calcite.esm.js"></script>
</head>

<body>
  <div class="grid-container padding-leader-2">
    <div class="column-20 trailer-2 header">
      <calcite-button scale="l" href="/">Home</calcite-button>
      <h2>arcgis-hub-gallery: Group Members</h2>

    </div>
    <div class="column-20">
      <calcite-button onClick="signIn()">Sign In</calcite-button>
      <calcite-button onClick="signOut()">Sign Out</calcite-button>
      <div id="userinfo"></div>

      <br>
      <arcgis-hub-gallery
        layout='grid'
        limit='5'
        selection-mode="multiple"
        show-thumbnail
        show-layout-switcher
        show-search
        show-sort
        show-chips
        show-facets
        show-more-results-btn>

      </arcgis-hub-gallery>

      <arcgis-app-identity
        client-id="zhGPGlPQaq11eIQC"
        redirect-uri="http://localhost:3333/html/redirect.html"
        portal="https://devext.arcgis.com">
      </arcgis-app-identity>
    </div>


  </div>
  <script>

    // APPIds
    // DEVEXT: zhGPGlPQaq11eIQC / 906e855bb18b4cf49031482c0c117f09
    // QAEXT:  u3KZUyh6wbCQtuCj / ???


    function applyParams() {
      const paramString = document.getElementById('qs').value;
      const parts = paramString.split("&");
      const params = parts.reduce((acc, entry) => {
        if (entry) {
          const [key, val] = entry.split("=");
          if (val !== "null") {
            acc[key] = val;
          }
        }
        return acc;
      }, {});

      setProp("state", params);
    }
    // These would be raised from some user profile type control
    function signIn() {
      const evt = new CustomEvent('arcgisAppIdentityStartSignIn')
      document.dispatchEvent(evt);
    }
    function signOut() {
      const evt = new CustomEvent('arcgisAppIdentityStartSignOut')
      document.dispatchEvent(evt);
    }

    // These listeners could be in any component that wants a session
    document.addEventListener('arcgisAppIdentitySignedIn', (evt) => {
      setProp('context', evt.detail);
      showUserInfo(evt.detail.session);
    });

    document.addEventListener('arcgisAppIdentitySignedOut', (evt) => {
      setProp('context', evt.detail);
      showUserInfo(evt.detail.session);
    });

    const params = {};

    document.addEventListener('arcgisHubContentGalleryStateChange', (evt) => {
      showParams(evt.detail);
    });

    function showParams(params) {
      // serialize
      let qs = "";
      for (key in params) {
        if (params[key]) {
          qs = `${qs}&${key}=${params[key]}`
        }

      }
      const el = document.getElementById('params');
      el.innerText = `State as params: ${qs}`;
    }

    // Simple function to so something when auth changes
    function showUserInfo(session) {
      const el = document.getElementById('userinfo');
      if (session) {
        el.innerText = `User ${session.username} authenticated`;
      } else {
        el.innerText = 'No user authenticated';
      }
    }


    // Set a property on the element
    function setProp(key, value) {
      const el = document.querySelector("arcgis-hub-gallery");
      el[key] = value;
    }

    const groupMemberQuery = {
      targetEntity: "groupMember",
        filters: [
         {
          predicates: [ { group: "5f5970fcc7b042888e23156fda9c3c70" /*"0336dd77f5614943a166ebc0308205f6"*/ } ]
         }
        ]
    }


    const facets = [
      {
        label: "Group Role",
        key: "access",
        display: "single-select",
        operation: "OR",
        options: [
          {
            label: "All",
            key: "all",
            selected: true,
            predicates: [],
          },
          {
            label: "Admin",
            key: "admin",
            selected: false,
            predicates: [{
              memberType: "admin",
            }],
          },
          {
            label: "Member",
            key: "member",
            selected: false,
            predicates: [{
              memberType: "member",
            }],
          }
        ],
      },
    ]


    setProp("query", groupMemberQuery);
    setProp("facets", facets);

    // bulk actions
    const bulkActions = {
      // position: 'top',
      actions: [
        {
          name: 'messageUsers',
          icon: 'envelope',
          text: 'Message users',
        },
        {
          name: 'removeUsersFromGroup',
          args: {
            groupId: '5f5970fcc7b042888e23156fda9c3c70'
          },
          icon: 'user-minus',
          text: 'Remove users',
        },
        {
          text: 'Change role',
          icon: 'user-key',
          children: [
            {
              name: 'changeRole',
              args: {
                role: 'manager'
              },
              text: 'Manger',
              helperText: 'Can add/remove content and invite/remove people (except for the owner).'
            },
            {
              name: 'changeRole',
              args: {
                role: 'member'
              },
              text: 'Member',
              helperText: 'Can see content within the team.'
            }
          ]
        }
      ]
    };
      setProp('bulkActions', bulkActions);

      document.querySelector('arcgis-hub-gallery').addEventListener('arcgisHubGallerySelect', async evt => {
        console.log('arcgisHubGallerySelect: ', evt.detail);
      });

      document.querySelector('arcgis-hub-gallery').addEventListener('arcgisHubGalleryBulkAction', async evt => {
        console.log('arcgisHubGalleryBulkAction: ', evt.detail);

        const { action } = evt.detail;
        let idx = 2;
        switch (action.name) {
          case 'messageUsers':
            idx = 0;
            break;
          case 'removeUsersFromGroup':
            idx = 1;
            break;
        }

        bulkActions.actions[idx].loading = true;
        setProp('bulkActions', structuredClone(bulkActions));

        await new Promise(resolve => setTimeout(resolve, 1500))

        // depending on what we just did (like maybe remove users from the group), we might need to to
        // refresh the gallery
        // document.querySelector('arcgis-hub-gallery').refresh();;
        // or update the selection
        // setProp('gallerySelection', { groupMember: [] });

        bulkActions.actions[idx].loading = false;
        setProp('bulkActions', structuredClone(bulkActions));
      });

      setProp('layoutOptions', [ 'grid', 'list', 'compact', 'table' ]);
  </script>
</body>

</html>
