<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Hub Components: Simple Gallery</title>

    <style>
      .header {
        display: flex;
        justify-content: space-between;
      }

      .nav {
        list-style: none;
        display: flex;
        flex-direction: column;
        padding: 0;
      }
      .jsoneditor {
        height: 300px;
      }
      .editor-container > label {
        font-weight: bold;
        margin: 0 0 0.25rem 0;
      }

      .jsoneditor-tree table {
        margin-bottom: 0;
      }
    </style>
    <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />

    <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "@arcgis/core/": "https://js.arcgis.com/4.25/@arcgis/core/"
        }
      }
    </script>

    <script type="module" src="../../build/hub-components.esm.js"></script>
    <script nomodule src="../../build/hub-components.js"></script>
    <link href="../../jsoneditor/jsoneditor.min.css" rel="stylesheet" type="text/css">
    <script src="../../jsoneditor/jsoneditor.min.js"></script>
    <link rel="stylesheet" href="../../calcite/calcite.css" />
    <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
    <link rel="stylesheet" href="../calcite-web.min.css" />
  </head>

  <body>
    <div class="grid-container padding-leader-2">
      <div class="column-20 trailer-2 header">
        <calcite-button scale="l" href="/">Home</calcite-button>
        <h2>arcgis-hub-gallery: items</h2>
      </div>
      <div class="column-20">
        <calcite-button onClick="signIn()">Sign In</calcite-button>
        <calcite-button onClick="signOut()">Sign Out</calcite-button>
        <div id="userinfo"></div>

        <calcite-radio-group>
          <calcite-radio-group-item value="arcgis" checked>Portal API</calcite-radio-group-item>
          <calcite-radio-group-item value="arcgis-hub">Hub API</calcite-radio-group-item>
        </calcite-radio-group>
      </div>
      <div class="column-20"><h4>Action Links</h4></div>
      <div class="column-10">
        <p>Action links can be passed into the Gallery as an `ICardActionLink[]`. The first entry will render as a button on the card, the second and third will be buttons on in the tooltip on the ellipsis</p>
      </div>
      <div class="column-10">
        <div id="actions" name="actions"></div>
        <calcite-button id="btnApply">Apply</calcite-button>
        <calcite-button id="toggleView">Toggle View</calcite-button>
      </div>

      <div class="column-20">
        <br />
        <arcgis-hub-gallery
          layout="list"
          limit="9"
          api="hub"
          well-known-collection="all"
          link-target="siteRelative"

        >
        </arcgis-hub-gallery>

        <arcgis-app-identity client-id="EF9uxuFlOrgf7WpI" redirect-uri="http://localhost:3333/html/redirect.html" portal="https://qaext.arcgis.com"> </arcgis-app-identity>
      </div>
    </div>
    <script>
      // APPIds
      // DEVEXT: zhGPGlPQaq11eIQC / 906e855bb18b4cf49031482c0c117f09
      // QAEXT:  u3KZUyh6wbCQtuCj / ???
      const DEFAULT_ACTIONS = [{
            action: "deleteItem",
            label: "Delete",
            showLabel: true,
            icon: "trash",
            buttonStyle: "transparent"
          }]


      const initEditor = async () => {
        const editorOpts = { modes: ['code', 'tree'], search: false, navigationBar: false, enableSort: false, enableTransform: false };
        actionEditor = new JSONEditor(document.getElementById('actions'), editorOpts, DEFAULT_ACTIONS);
      }

      initEditor();

      const boolProps = [
        "showThumbnail",
        "showSearch",
        "showSort",
        "showChips",
        "showFacets",
        "showMoreResultsBtn",
        "showResultsCount",
        "showLayoutSwitcher",
        "showBackToTopBtn"
      ]

      let viewState = "simple";

      document.addEventListener('calciteRadioGroupChange', evt => {
        console.log(`Changing API to ${evt.detail}`);
        const apiType = evt.detail;
        setProp('apiType', apiType);
      });
      document.addEventListener('click', evt => {
        if (evt.target.id === 'btnApply') {
          const actionLinks = actionEditor.get();
          try {
            setProp('cardActionLinks', actionLinks);
          } catch(ex) {
            console.error(ex);
          }
        }
        if (evt.target.id === 'toggleView') {
          const val = viewState === "simple" ? true : false;
          boolProps.map(prop => {
            console.log(`setting ${prop} to ${val}`);
            setProp(prop, val);
          });
          if (!val) {
            viewState = "simple";
          } else {
            viewState = "complex";
          }
        }
      });
      document.addEventListener('arcgisHubGalleryAction', evt => {
        console.log(`galleryAction: ${evt.detail.action} for ${evt.detail.model.id}`);
      });
      document.addEventListener('arcgisHubCardAction', (evt) => {
        alert(`cardAction: ${evt.detail.action} for ${evt.detail.model.type} ${evt.detail.model.id}`);
      })
      document.addEventListener('hubTelemetry', evt => {
        console.log(`telemetry`, evt.detail);
      });
      function applyParams() {
        const paramString = document.getElementById('qs').value;
        const parts = paramString.split('&');
        const params = parts.reduce((acc, entry) => {
          if (entry) {
            const [key, val] = entry.split('=');
            if (val !== 'null') {
              acc[key] = val;
            }
          }
          return acc;
        }, {});

        setProp('state', params);
      }
      // These would be raised from some user profile type control
      function signIn() {
        const evt = new CustomEvent('arcgisAppIdentityStartSignIn');
        document.dispatchEvent(evt);
      }
      function signOut() {
        const evt = new CustomEvent('arcgisAppIdentityStartSignOut');
        document.dispatchEvent(evt);
      }

      // These listeners could be in any component that wants a session
      document.addEventListener('arcgisAppIdentitySignedIn', evt => {
        setProp('context', evt.detail);
        showUserInfo(evt.detail.session);
      });

      document.addEventListener('arcgisAppIdentitySignedOut', evt => {
        setProp('context', evt.detail);
        showUserInfo(evt.detail.session);
      });

      const params = {};

      document.addEventListener('arcgisHubContentGalleryStateChange', evt => {
        showParams(evt.detail);
      });

      function showParams(params) {
        // serialize
        let qs = '';
        for (key in params) {
          if (params[key]) {
            qs = `${qs}&${key}=${params[key]}`;
          }
        }
        const el = document.getElementById('params');
        el.innerText = `State as params: ${qs}`;
      }

      // Simple function to so something when auth changes
      function showUserInfo(session) {
        const el = document.getElementById('userinfo');
        if (session) {
          el.innerText = `User ${session.username} authenticated`;
        } else {
          el.innerText = 'No user authenticated';
        }
      }

      // Set a property on the element
      function setProp(key, value) {
        const el = document.querySelector('arcgis-hub-gallery');
        el[key] = value;
      }

      const collection = {
        targetEntity: 'item',
        label: 'Example Collection',
        key: 'example',
        include: [],
        sortDirection: 'asc',
        sortField: 'title',
        scope: {
          targetEntity: 'item',
          // Change this well known collection key to experment with different collection bases
          collection: 'all',
          filters: [
            // Change the predicates here to experiment with changing the Collection scope
            {
            // predicates: [{type: "Hub Project"}]
            // predicates: [{ orgid: '6yFNtz2GHg0wHfGr' }],
              predicates: [{
                group: [
                  // e2e tests
                  // '08c4099d18ce41b48055e194e12d39fe',

                  // download site
                  "3b9ffb00851f47dab74494018ffa00fb",
                  "95cc82a857fb40038628eea0dfc0210f",
                  "671f07ab39bc4ea5a345d523328ccc06",
                  "e79e2021e843428e9e0dab77eadbd507",
                  "28a62e584bf04d5e8ade7e23467b7457",
                  "1e82b21c126b479cafecd5a6149d3cd6",
                ],
              }]
            },
          ],
        },
      };

      const facets = [
        {
          label: 'Modified',
          key: 'modified',
          display: 'date-range',
          state: 'open',
          field: 'modified',
          max: new Date(),
        },
        {
          label: 'Location',
          key: 'bbox',
          display: 'map',
          state: 'open',
          field: 'bbox',
          tooltip: 'testing 123'
        },
        {
          label: 'License',
          key: 'license',
          display: 'multi-select',
          state: 'open',
          field: 'license',
        },
        {
          label: 'Source',
          key: 'source',
          display: 'multi-select',
          state: 'open',
          field: 'source',
        },
        {
          display: 'multi-select',
          label: 'Type',
          key: 'type',
          field: 'type',
          operation: 'OR',
          options: [],
          aggLimit: 100,
        },
        {
          display: 'multi-select',
          label: 'Tags',
          key: 'tags',
          field: 'tags',
          operation: 'OR',
          options: [],
          aggLimit: 100,
        },
        {
          display: 'tree',
          label: 'Categories',
          key: 'categories',
          field: 'categories',
          operation: 'OR',
          options: [],
          aggLimit: 100
        }
      ];

      setProp('collection', collection);
      setProp('facets', facets);
    </script>
  </body>
</html>
