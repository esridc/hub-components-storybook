<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entity Workspace Harness</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
  </style>

  <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
  <script type="importmap">
      {
        "imports": {
          "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
        }
      }
    </script>
  <!-- load chart components -->
  <!-- NOTE: you will need to add this to any story that uses arcgis-hub-chart -->
  <link rel="stylesheet" href="../../arcgis-charts-components/arcgis-charts-components.css" />
  <script type="module" src="../../arcgis-charts-components/arcgis-charts-components.esm.js"></script>
  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
  <script type="module" src="../../calcite/calcite.esm.js"></script>
  <link rel="stylesheet" href="../calcite-web.min.css">
</head>

<body>
  <harness-header page-title="Gallery Generator"></harness-header>
  <div class="grid-container padding-leader-4">
    <div class="column-12">
      <h3>Gallery Configuration</h3>
      <div id="editor-container"></div>
      <!-- <calcite-button id="generate-button">Generate Gallery</calcite-button> -->
    </div>
    <div class="column-12" id="jsx-output"></div>
    <div class="column-24 padding-leader-2" id="sample-gallery"></div>
  </div>

  <script>
    let context;
    let editor;
    let valuesToApply = {};

    function setProp(key, value) {
      const el = document.querySelector('arcgis-hub-gallery');
      el[key] = value;
    }

    const getProp = (obj, path) => {
      return path.split(".").reduce(function (prev, curr) {
        return prev ? prev[curr] : undefined;
      }, obj);
    }

    const schema = {
      "type": "object",
      "properties": {
        // query options
        "group": {
          type: "array",
          items: {
            type: "string",
          },
        },
        "type": {
          type: "array",
          items: {
            type: "string",
          },
        },
        "tags": {
          type: "array",
          items: {
            type: "string",
          },
        },
        "categories": {
          type: "array",
          items: {
            type: "string",
          },
        },

        // visual options
        "show-search": {
          type: "boolean",
          default: false
        },
        "show-sort": {
          type: "boolean",
          default: false
        },
        "show-layout-switcher": {
          type: "boolean",
          default: false
        },
        "show-more-results-btn": {
          type: "boolean",
          default: false
        },
        "show-results-count": {
          type: "boolean",
          default: false
        },
        limit: {
          type: "number",
          default: 1
        },
        layout: {
          type: "string",
          default: "grid"
        },
        layoutOptions: {
          type: "array",
          items: {
            type: "string",
          },
          default: ["grid", "list"]
        },
        showThumbnails: {
          type: "boolean",
          default: true
        },
      }
    }

    const uiSchema = {
      "type": "Layout",
      "elements": [
        {
          "type": "Section",
          "options": {
            "section": "accordion"
          },
          "elements": [
            {
              "type": "Section",
              "label": "Query Configuration",
              "options": {
                "expanded": true,
                "section": "accordionItem"
              },
              "elements": [
                {
                  label: "Type",
                  scope: "/properties/type",
                  type: "Control",
                  options: {
                    control: "hub-field-input-combobox",
                    items: [],
                    allowCustomValues: true,
                    selectionMode: "multiple",
                    placeholderIcon: "apps",
                  },
                },
                {
                  label: "Tags",
                  scope: "/properties/tags",
                  type: "Control",
                  options: {
                    control: "hub-field-input-combobox",
                    items: [],
                    allowCustomValues: true,
                    selectionMode: "multiple",
                    placeholderIcon: "tag",
                  },
                },
                {
                  label: "Categories",
                  scope: "/properties/categories",
                  type: "Control",
                  options: {
                    control: "hub-field-input-combobox",
                    items: [],
                    allowCustomValues: true,
                    selectionMode: "multiple",
                    placeholderIcon: "label",
                  },
                },
                {
                  label: "Groups",
                  scope: "/properties/group",
                  type: "Control",
                  options: {
                    control: "hub-field-input-combobox",
                    items: [],
                    allowCustomValues: true,
                    selectionMode: "multiple",
                    placeholderIcon: "group",
                  },
                },
                {
                  label: "Limit",
                  scope: "/properties/limit",
                  type: "Control",
                  options: {
                    control: "hub-field-input-input"
                  }
                }
              ]
            },
            {
              "type": "Section",
              "label": "Visual Configuration",
              "options": {
                "expanded": false,
                "section": "accordionItem"
              },
              "elements": [
                {
                  "label": "Search Bar",
                  "scope": "/properties/show-search",
                  "type": "Control",
                  "options": {
                    "control": "hub-field-input-switch"
                  }
                },
                {
                  "label": "Sort UI",
                  "scope": "/properties/show-sort",
                  "type": "Control",
                  "options": {
                    "control": "hub-field-input-switch"
                  }
                },
                {
                  "label": "Layout Switcher",
                  "scope": "/properties/show-layout-switcher",
                  "type": "Control",
                  "options": {
                    "control": "hub-field-input-switch"
                  }
                },
                {
                  "label": "Show Results Count",
                  "scope": "/properties/show-results-count",
                  "type": "Control",
                  "options": {
                    "control": "hub-field-input-switch"
                  }
                },
                {
                  "label": "Show More Results Button",
                  "scope": "/properties/show-more-results-btn",
                  "type": "Control",
                  "options": {
                    "control": "hub-field-input-switch"
                  }
                },
              ]
            },
          ]
        }
      ]
    }

    const values = {
      "group": [],
      "tags": [],
      "categories": []
    }

    const translations = {
      "groups": "Groups",
      "tags": "Tags",
      "categories": "Categories"
    }
    const translationFunc = (key) => getProp(translations, key);

    editor = document.createElement('arcgis-configuration-editor')
    editor.schema = schema;
    editor.uiSchema = uiSchema;
    editor.values = values;
    editor.t = translationFunc;
    editor.context = context;

    editor.addEventListener('arcgisConfigurationEditorChange', (evt) => {
      valuesToApply = evt.detail.values;
    });

    const container = document.getElementById('editor-container');
    container.appendChild(editor);

    const onEditorChanged = function () {
      const predicate = Object.keys(valuesToApply)
        .filter(key => !key.startsWith('show') && !!valuesToApply[key].length)
        .reduce((p, key) => {
          p[key] = valuesToApply[key]
          return p;
        }, {});
      const query = {
        targetEntity: 'item',
        filters: [{
          predicates: [predicate]
        }]
      }

      const visualOptions = Object.keys(valuesToApply)
        .filter(key => key.startsWith('show') && valuesToApply[key])
        .sort()
        .join(' ');

      const queryContainer = document.querySelector("#jsx-output");
      queryContainer.innerHTML =
`
<h3>JSX Code</h3>
<pre><code>
/* Defines the base query of the gallery */
const query: IQuery = ${JSON.stringify(query, null, 2)}

/* Renders the gallery with configured arguments */
&ltarcgis-hub-gallery ${visualOptions} query={query}/&gt
</code></pre>
`;
      const exampleGallery = document.createElement('arcgis-hub-gallery');
      exampleGallery.query = query;
      exampleGallery.showSearch = valuesToApply['show-search'];
      exampleGallery.showSort = valuesToApply['show-sort'];
      exampleGallery.showLayoutSwitcher = valuesToApply['show-layout-switcher'];
      exampleGallery.showMoreResultsBtn = valuesToApply['show-more-results-btn'];
      exampleGallery.showResultsCount = valuesToApply['show-results-count'];
      exampleGallery.context = context;

      const galleryContainer = document.querySelector("#sample-gallery");
      galleryContainer.innerHTML = '<h3>Live Example</h3>';
      galleryContainer.appendChild(exampleGallery);
    };

    editor.addEventListener("arcgisConfigurationEditorInitialized", onEditorChanged);
    editor.addEventListener("arcgisConfigurationEditorChange", onEditorChanged);

    // AUTH FUNCTIONALITY - needed for the gallery picker field
    // TODO: this can go away when arcgis-configuration-editor gets context from stencil store
    document.addEventListener('arcgisAppIdentitySignedIn', (evt) => {
      context = evt.detail;
      if (editor) { editor.context = evt.detail; }
    });
    document.addEventListener('arcgisAppIdentitySignedOut', (evt) => {
      context = evt.detail;
      if (editor) { editor.context = evt.detail; }
    });
  </script>
</body>

</html>
