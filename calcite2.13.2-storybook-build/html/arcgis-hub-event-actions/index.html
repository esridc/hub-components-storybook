<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Hub Components: Event actions</title>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      calcite-notice {
        margin-top: 4rem;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }
    </style>
    <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
    <script type="importmap">
      {
        "imports": {
          "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
        }
      }
    </script>
    <script type="module" src="../../build/hub-components.esm.js"></script>
    <script nomodule src="../../build/hub-components.js"></script>
    <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
    <link rel="stylesheet" href="../calcite-web.min.css" />
  </head>
  <body>
    <script src="https://unpkg.com/@esri/arcgis-rest-request@3.4.3/dist/umd/request.umd.min.js"></script>
    <script src="https://unpkg.com/@esri/arcgis-rest-auth@3.4.3/dist/umd/auth.umd.min.js"></script>
    <arcgis-app-identity client-id="EF9uxuFlOrgf7WpI" redirect-uri="http://localhost:3333/html/redirect.html" portal="https://qaext.arcgis.com"> </arcgis-app-identity>
    <harness-header page-title="Event actions"></harness-header>
    <calcite-notice open kind="info" scale="s" width="full" icon>
      <div slot="message">This component requires authentication to render. Please auth as juliana_pa on QA.</div>
    </calcite-notice>
    <div class="container">
      <select>
        <option value="clyegwbsz004x6q01866nq5cr" selected>Hybrid event</option>
        <option value="clyepigo2005b8g01xpywajl8">In-person event</option>
        <option value="clyepkp4g00606q01sufwv4fd">Online event</option>
      </select>
    </div>
    <script>
      const url = new URL(window.location.href);
      const container = document.querySelector('.container');
      const identifier = url.searchParams.get('identifier') ?? document.querySelector('option').value;
      const select = document.querySelector('select');
      select.value = identifier;
      const actions = document.createElement('arcgis-hub-event-actions');
      Object.assign(actions, { identifier });
      container.appendChild(actions);
      select.addEventListener('change', function (evt) {
        const url = new URL(window.location.href);
        url.searchParams.set('identifier', evt.target.value);
        window.location.href = url.toString();
      });
      document.addEventListener('hubTelemetry', (evt) => console.log('hubTelemetry:', evt.detail));
    </script>
  </body>
</html>
