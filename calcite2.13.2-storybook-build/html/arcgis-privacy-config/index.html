<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arcgis-privacy-config</title>

  <!-- link to calcite components CSS  -->
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />

  <!-- NOTE: calcite web CSS is only used for grid layout of this page -->
  <!-- see: https://esri.github.io/calcite-web/documentation/grid/#grid -->
  <link rel="stylesheet" href="../calcite-web.min.css" />

  <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
  <script type="importmap">
      {
        "imports": {
          "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
        }
      }
    </script>

  <!-- load calcite components -->
  <script type="module" src="../../calcite/calcite.esm.js"></script>

  <!-- load hub components -->
  <script type="module" src="../../build/hub-components.esm.js"></script>
</head>

<body>
  <harness-header page-title=arcgis-privacy-config></harness-header>
  <div class="grid-container padding-leader-8">
    <!-- docs about grid container: https://esri.github.io/calcite-web/documentation/grid/#grid -->

    <div class="column-8 pre-2 post-2 leader-6 trailer-2">
      <h2>Layout editor variant</h2>
      <arcgis-privacy-config is-layout-editor></arcgis-privacy-config>
    </div>

    <div class="column-8 pre-2 post-2 leader-6 trailer-2">
      <h2>Default variant</h2>
      <arcgis-privacy-config></arcgis-privacy-config>
    </div>
  </div>

  <script>
    // set a property on the element
    function setProp(key, value) {
      const el = document.querySelectorAll("arcgis-privacy-config").forEach(el => {
        el[key] = value;
      });
    }

    setProp('config', {
      allowPrivacyConfig: true,
      blocking: false,
      disclaimer: [
        { text: 'This is the consent notice....' }
      ],
      policyURL: ''
    });

    document.querySelector('arcgis-privacy-config').addEventListener('hubPrivacyPreferencesConfigChanged', (e) => {
      console.log(e.detail);
    });
  </script>
</body>

</html>
