<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>Hub Components: Map Customization</title>

  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #attribution {
      text-align: center;
      margin: 0;
      padding: 0;
    }

    arcgis-hub-map {
      height: 100vh;
      width: 100%;
    }

    .slider {
      width: 100%;
      height: 60px;
    }

    #pixelVal {
      padding-bottom: 35px;
    }

    #infoDiv {
      padding: 10px;
      width: 500px;
    }
  </style>

  <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>

  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
  <script type="module" src="../../calcite/calcite.esm.js"></script>
  <link rel="stylesheet" href="../calcite-web.min.css" />
</head>

<!-- Original Sample Code From - https://developers.arcgis.com/javascript/latest/sample-code/sandbox/?sample=layers-imagery-pixelvalues -->

<body>
  <harness-header page-title="Map"></harness-header>
  <arcgis-app-identity client-id="EF9uxuFlOrgf7WpI" redirect-uri="http://localhost:3333/html/redirect.html" portal="https://qaext.arcgis.com"> </arcgis-app-identity>
  <arcgis-hub-map id="map" basemap="dark-gray-vector" center="-32,28" zoom="2" />
  <script>
    const mapEl = document.querySelector('arcgis-hub-map');
    mapEl['settings'] = {
      // Web Map ID
      baseViewItemId: ['3c96b290041c43df8f74f23baeb0d2d4'],
      // Web Scene ID
      // baseViewItemId: ['283d79831760497a9c1ab41b98284108']
    };
    mapEl.addEventListener('arcgisHubMapViewReady', ({ detail: { view } }) => {
      console.log('arcgisHubMapViewReady:', view);
    });
  </script>
</body>

</html>
