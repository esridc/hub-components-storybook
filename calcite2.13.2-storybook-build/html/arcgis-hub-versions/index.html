<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arcgis-hub-versions</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
  </style>

  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
  <link rel="stylesheet" href="../calcite-web.min.css">
</head>

<body>
  <div class="grid-container padding-leader-2">
    <!-- docs about grid container: https://esri.github.io/calcite-web/documentation/grid/#grid -->
    <div class="column-24 trailer-2 header">
      <calcite-button scale="l" href="/">Home</calcite-button>
      <h2>arcgis-hub-versions</h2>
    </div>

    <div class="column-24">
      <calcite-button onClick="signIn()">Sign In</calcite-button>
      <calcite-button onClick="signOut()">Sign Out</calcite-button>
      <arcgis-app-identity client-id="EF9uxuFlOrgf7WpI" redirect-uri="http://localhost:3333/html/redirect.html" portal="https://qaext.arcgis.com"> </arcgis-app-identity>
      <div id="userinfo"></div>

      <h5 class="leader-1">Selected version: <span id="selected-version"></span></h5>

      <!-- <calcite-button onClick="showDeleteModal()">Show delete modal</calcite-button> -->
      <arcgis-hub-versions
        id="arcgis-hub-versions-harness"
        item-id="2b90df90e70549c1a256ebb6230f7451"
        portal="https://qaext.arcgis.com"
        published-version-id="i6d7iyn35"
      >
      </arcgis-hub-versions>
    </div>
  </div>

  <script>
    // set a property on the element
    function setProp(key, value) {
      const el = document.querySelector("arcgis-hub-versions");
      el[key] = value;
    }

    function signIn() {
      const evt = new CustomEvent('arcgisAppIdentityStartSignIn');
      document.dispatchEvent(evt);
    }
    function signOut() {
      const evt = new CustomEvent('arcgisAppIdentityStartSignOut');
      document.dispatchEvent(evt);
    }

    // These listeners could be in any component that wants a session
    document.addEventListener('arcgisAppIdentitySignedIn', evt => {
      setProp('context', evt.detail);
      showUserInfo(evt.detail.session);
    });

    document.addEventListener('arcgisAppIdentitySignedOut', evt => {
      setProp('context', evt.detail);
      showUserInfo(evt.detail.session);
    });

    // Simple function to so something when auth changes
    function showUserInfo(session) {
      const el = document.getElementById('userinfo');
      if (session) {
        el.innerText = `User ${session.username} authenticated`;
      } else {
        el.innerText = 'No user authenticated';
      }
    }


    document.querySelector("arcgis-hub-versions").addEventListener('arcgisHubVersionsVersionSelected', (e) => {
      const { id, created, name } = e.detail;
      console.log(`arcgisHubVersionsVersionSelected: ${e.detail.id}`);
      const dateFormat = { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: 'numeric' };
      const createdString = new Intl.DateTimeFormat('en-US', dateFormat).format(new Date(created));
      document.getElementById('selected-version').innerText = name || createdString;

      document.querySelector('arcgis-hub-versions').activeVersionId = id;
    });

    // document.querySelector("arcgis-hub-versions").addEventListener('calciteListItemSelect', (e) => {
    //   alert('onCalciteListItemSelect', e.detail);
    // });

    // function showDeleteModal(key, value) {
    //   const el = document.querySelector("arcgis-hub-versions");
    //   el.showDeleteModal('ipdsyxwl9');
    // }
  </script>
</body>

</html>
