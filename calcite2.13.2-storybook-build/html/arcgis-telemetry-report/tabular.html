<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arcgis-telemetry-report - TABULAR</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }

    arcgis-telemetry-report {
      margin-bottom: 2rem;
    }
  </style>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
  <link rel="stylesheet" href="../calcite-web.min.css">

  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>
  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <script type="module" src="../../calcite/calcite.esm.js"></script>
</head>

<body>
  <div class="grid-container padding-leader-2">
    <div class="column-20 trailer-2 header">
      <calcite-button scale="l" href="/">Home</calcite-button>
      <h2>arcgis-telemetry-report - TABULAR</h2>
    </div>

    <div class="column-20">
      <calcite-button onClick="signIn()">Sign In</calcite-button>
      <calcite-button onClick="signOut()">Sign Out</calcite-button>
      <div id="userinfo"></div></br></br>

      <arcgis-app-identity client-id="EF9uxuFlOrgf7WpI"
        redirect-uri="http://localhost:3333/html/redirect.html"
        portal="https://qaext.arcgis.com">
      </arcgis-app-identity>

      <div class="trailer-2">
        <arcgis-hub-date-range-picker value="last30Days"/>
      </div>

        <arcgis-telemetry-report
          type="tabular"
          id="top-10-downloads-table"
          report-title="Top 10 Downloads"
          subtitle="This is a tabular subtitle"
          hostname="national-parks-qa-pre-a-hub.hubqa.arcgis.com">
        </arcgis-telemetry-report></br>

        <arcgis-telemetry-report
          type="tabular"
          id="top-10-referrers-table"
          report-title="Top 10 Referrers"
          telemetry-event="referrers"
          hostname="national-parks-qa-pre-a-hub.hubqa.arcgis.com">
        </arcgis-telemetry-report>

        <arcgis-telemetry-report
          type="tabular"
          id="session-activity-table"
          category="day"
          end-date="2023-06-08T17:12:28.944Z"
          start-date="2023-05-09T17:12:28.944Z"
          report-title="Session Duration (with data transforms)"
          telemetry-event="session-activity"
          hostname="national-parks-qa-pre-a-hub.hubqa.arcgis.com">
        </arcgis-telemetry-report>
      </br>
    </div>
  </div>

  <script>
    const reportIds = [];

    [
      {
        id: "top-10-downloads-table",
        series: [
          {
            name: "contentId",
            title: "Item ID",
            value: {
              display: (id) => `ID: ${id}`,
              link: {
                href: (id) => `https://google.com`,
                target: "blank"
              }
            }
          },
          "type"
        ],
        orderBy: [{ name: "other-events:count", direction: "desc" }],
        telemetryEvent: { category: "Interaction", action: "Download" },
        telemetryContext: {
          customDimensionsConfig: {
            details: 1,
            userType: 2,
            id: 3,
            type: 4
          }
        }
      },
      {
        id: "top-10-referrers-table",
        series: [],
        limit: 10,
        orderBy: [{ name: "page-views:count", direction: "desc" }]
      },
      {
        id: "session-activity-table",
        orderBy: [{ name: 'day', direction: 'asc' }],
        dataTransforms: [
          {
            name: 'session-activity:average',
            value: {
              display: seconds => Math.round(Number(seconds) / 60)
            }
          }
        ]
      }
    ].forEach(demo => {
      reportIds.push(demo.id);
      if (demo.telemetryEvent) {
        setProp(demo.id, 'telemetryEvent', demo.telemetryEvent);
      }
      if (demo.series) {
        setProp(demo.id, 'series', demo.series);
      }
      if (demo.orderBy) {
        setProp(demo.id, 'orderBy', demo.orderBy);
      }
      if(demo.limit) {
        setProp(demo.id, 'limit', demo.limit);
      }
      if(demo.telemetryContext) {
        setProp(demo.id, 'telemetryContext', demo.telemetryContext);
      }
      if (demo.dataTransforms) {
        setProp(demo.id, 'dataTransforms', demo.dataTransforms);
      }
    })

    function setProp(id, key, value) {
      const el = document.querySelector(`#${id}`);
      el[key] = value;
    }

    // These would be raised from some user profile type control
    function signIn() {
      const evt = new CustomEvent('arcgisAppIdentityStartSignIn')
      document.dispatchEvent(evt);
    }
    function signOut() {
      const evt = new CustomEvent('arcgisAppIdentityStartSignOut')
      document.dispatchEvent(evt);
    }

    // These listeners could be in any component that wants a session
    document.addEventListener('arcgisAppIdentitySignedIn', (evt) => {
      // update userInfo
      reportIds.forEach(id => setProp(id, 'context', evt.detail));
      showUserInfo(evt.detail.session);
    });

    document.addEventListener('arcgisAppIdentitySignedOut', (evt) => {
      // update userInfo
      reportIds.forEach(id => setProp(id, 'context', evt.detail));
      showUserInfo(evt.detail.session);
    });

    document.addEventListener('arcgisHubDateRangePickerSelect', (evt) => {
      const { startDate, endDate } = evt.detail
      reportIds.forEach(id => {
        setProp(id, 'startDate', startDate.toISOString());
        setProp(id, 'endDate', endDate.toISOString());
      });
    })

    // Simple function to so something when auth changes
    function showUserInfo(session) {
      const el = document.getElementById('userinfo');
      if (session) {
        el.innerText = `User ${session.username} authenticated`;
      } else {
        el.innerText = 'No user authenticated';
      }
    }
  </script>
</body>

</html>
