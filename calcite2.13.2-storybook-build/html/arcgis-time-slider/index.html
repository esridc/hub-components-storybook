<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>Hub Components: Time Slider Map Widget</title>

  <style>
    html,
    body,
    #map-container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    arcgis-time-slider {
      position: absolute;
      bottom: 2rem;
      left: 1rem;
      right: 1rem;
      width: calc(100% - 2rem);
    }
  </style>

  <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>

  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
</head>

<body>
  <div id="map-container"></div>
  <div id="slider-container"></div>
  <script type="module">
    import MapView from '@arcgis/core/views/MapView.js';
    import WebMap from '@arcgis/core/WebMap.js';
    import esriConfig from '@arcgis/core/config.js';
    import TimeSlider from '@arcgis/core/widgets/TimeSlider.js';

    const container = document.querySelector('#map-container');
    esriConfig.portalUrl = 'https://qaext.arcgis.com/sharing/rest/content/items';
    const map = new WebMap({ portalItem: { id: '35455386cc97453197a61bd20eb46816' } });
    const view = new MapView({
      map,
      container
    });
    TimeSlider.getPropertiesFromWebMap(map).then(timeProperties => {
      const slider = document.createElement('arcgis-time-slider');
      Object.assign(slider, {
        view,
        ...timeProperties
      });
      document.body.appendChild(slider);
    });
  </script>
</body>

</html>
