<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Gallery Card</title>

    <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "@arcgis/core/": "https://js.arcgis.com/4.28/@arcgis/core/"
        }
      }
    </script>

    <script type="module" src="../../build/hub-components.esm.js"></script>
    <script nomodule src="../../build/hub-components.js"></script>
    <link href="../../jsoneditor/jsoneditor.min.css" rel="stylesheet" type="text/css" />
    <script src="../../jsoneditor/jsoneditor.min.js"></script>
    <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
    <link rel="stylesheet" href="../../calcite/calcite.css" />
    <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
    <link rel="stylesheet" href="../calcite-web.min.css" />
    <style>
      .controls {
        display: flex;
        gap: 2rem;
      }
      .canvas:has(arcgis-hub-event-gallery-card-editor) {
        display: grid;
        grid-template-rows: 1fr;
        grid-template-columns: 25rem 1fr;
        gap: 1rem;
      }
      .editor {
      }
      .cards {
        display: grid;
        gap: 1rem;
        grid-template-rows: 1fr;
        grid-template-columns: 1fr;
      }
      @media (min-width: 768px) {
        .cards-cols-2 {
          grid-template-columns: repeat(2, 1fr);
        }
        .cards-cols-3 {
          grid-template-columns: repeat(3, 1fr);
        }
        .cards-cols-4 {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      calcite-notice {
        margin: 0 0 2rem;
      }
    </style>
  </head>

  <body>
    <harness-header page-title="Event Gallery Card"></harness-header>
    <div class="grid-container padding-leader-4">
      <div class="column-24">
        <calcite-notice open kind="info" scale="s" width="full" icon>
          <div slot="message">This component requires authentication to render. Please auth as juliana_pa on QA.</div>
        </calcite-notice>
        <div class="controls"></div>
        <div class="canvas">
          <div class="editor"></div>
          <div class="cards"></div>
        </div>
      </div>
    </div>

    <script>
      const site = { id: 'bb5c755c71e34d9996c6fa27271fbeb1', tags: ['tag1', 'tag2'], type: 'Hub Site Application' };
      // V1 card schema
      let values = {
        access: [],
        corners: 'squared',
        entityIds: [site.id],
        eventIds: [],
        openIn: 'same',
        selectionMode: 'dynamic',
        shadow: 'none',
        showAdditionalInfo: true,
        titleHeading: 'h4',
        cardId: '42n6a4',
        tags: [],
        categories: [],
      };

      function createUI() {
        const cols = getColumns();
        const showEditor = getShowEditor();
        createControls(cols, showEditor);
        createEditor(showEditor);
        createCards(cols);
      }

      function createCards(cols) {
        const container = document.querySelector('.cards');
        container.classList.add(`cards-cols-${cols}`);
        Array.from({ length: cols }).forEach((_, idx) => {
          const card = document.createElement('arcgis-hub-event-gallery-card');
          Object.assign(card, { cardConfig: values });
          container.appendChild(card);
        });
      }

      function createEditor(showEditor) {
        if (showEditor) {
          const container = document.querySelector('.editor');
          const editor = document.createElement('arcgis-hub-event-gallery-card-editor');
          editor.addEventListener('arcgisHubEventGalleryCardEditorChange', function (evt) {
            values = {
              ...values,
              ...evt.detail.values,
            };
            const cards = document.querySelectorAll('arcgis-hub-event-gallery-card');
            cards.forEach(card => {
              Object.assign(card, { cardConfig: values });
            });
          });
          Object.assign(editor, { site, values });
          container.appendChild(editor);
        }
      }

      function createControls(cols, showEditor) {
        const controls = document.querySelector('.controls');
        createColumnControl(controls, cols);
        createEditorControl(controls, showEditor);
      }

      function createColumnControl(controls, cols) {
        const radioGroupLabel = document.createElement('calcite-label');
        const radioGroupLabelText = document.createTextNode('Cards per row:');
        const radioGroup = document.createElement('calcite-radio-button-group');
        radioGroup.addEventListener('calciteRadioButtonGroupChange', function (evt) {
          setQuerystringParam('cols', evt.target.selectedItem.value);
        });
        Object.assign(radioGroup, { layout: 'horizontal' });
        Array.from({ length: 4 }).forEach((_, idx) => {
          const num = idx + 1;
          const radioId = `cols-${num}`;
          const radioButtonLabel = document.createElement('calcite-label');
          Object.assign(radioButtonLabel, { layout: 'inline', for: radioId });
          const radioButtonLabelText = document.createTextNode(num.toString());
          const radioButton = document.createElement('calcite-radio-button');
          Object.assign(radioButton, { checked: num === cols, value: num, id: radioId });
          radioButtonLabel.appendChild(radioButton);
          radioButtonLabel.appendChild(radioButtonLabelText);
          radioGroup.appendChild(radioButtonLabel);
          radioGroupLabel.appendChild(radioGroupLabelText);
          radioGroupLabel.appendChild(radioGroup);
        });
        controls.appendChild(radioGroupLabel);
      }

      function createEditorControl(controls, showEditor) {
        const radioGroupLabel = document.createElement('calcite-label');
        const radioGroupLabelText = document.createTextNode('Show editor:');
        const radioGroup = document.createElement('calcite-radio-button-group');
        radioGroup.addEventListener('calciteRadioButtonGroupChange', function (evt) {
          setQuerystringParam('showEditor', evt.target.selectedItem.value);
        });
        Object.assign(radioGroup, { layout: 'horizontal' });
        [true, false].forEach(value => {
          const radioId = `show-editor-${value}`;
          const radioButtonLabel = document.createElement('calcite-label');
          Object.assign(radioButtonLabel, { layout: 'inline', for: radioId });
          const radioButtonLabelText = document.createTextNode(value);
          const radioButton = document.createElement('calcite-radio-button');
          Object.assign(radioButton, { checked: value === showEditor, value, id: radioId });
          radioButtonLabel.appendChild(radioButton);
          radioButtonLabel.appendChild(radioButtonLabelText);
          radioGroup.appendChild(radioButtonLabel);
          radioGroupLabel.appendChild(radioGroupLabelText);
          radioGroupLabel.appendChild(radioGroup);
        });
        controls.appendChild(radioGroupLabel);
      }

      function setQuerystringParam(name, value) {
        const url = new URL(window.location.href);
        url.searchParams.set(name, value);
        window.location = url.toString();
      }

      function getQuerystringParam(name, defaultValue, transform = val => val) {
        const url = new URL(window.location.href);
        return transform(url.searchParams.get(name) ?? defaultValue);
      }

      function getColumns() {
        const cols = getQuerystringParam('cols', '1', val => parseInt(val, 10));
        return isNaN(cols) || cols < 1 || cols > 4 ? 1 : cols;
      }

      function getShowEditor() {
        return getQuerystringParam('showEditor', 'false', val => val === 'true');
      }

      createUI();
    </script>
  </body>
</html>
