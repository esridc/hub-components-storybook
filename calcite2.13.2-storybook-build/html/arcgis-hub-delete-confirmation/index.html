<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arcgis-hub-delete-confirmation</title>

  <!-- link to calcite components CSS  -->
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />

  <!-- NOTE: calcite web CSS is only used for grid layout of this page -->
  <!-- see: https://esri.github.io/calcite-web/documentation/grid/#grid -->
  <link rel="stylesheet" href="html/calcite-web.min.css" />

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
    body {
      background-color: #f3f3f3;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>

  <!-- load calcite components -->
  <script type="module" src="../../calcite/calcite.esm.js"></script>

  <!-- load hub components -->
  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="https://cdn.skypack.dev/@esri/hub-common"></script>
</head>

<body>
  <harness-header page-title=arcgis-hub-delete-confirmation></harness-header>
  <div class="grid-container padding-leader-4">
    <!-- docs about grid container: https://esri.github.io/calcite-web/documentation/grid/#grid -->

    <div class="column-24">
      <h2>No Access Examples</h2>
    </div>
    <div class="column-12">
      <h4>Protected, Not Owner</h4>
      <arcgis-hub-delete-confirmation id="p-proj-no" ></arcgis-hub-delete-confirmation>
    </div>
     <div class="column-12">
      <h4>Not Protected, Not Owner</h4>
      <arcgis-hub-delete-confirmation id="proj-no" ></arcgis-hub-delete-confirmation>
    </div>


     <div class="column-24">
      <h2>As owner/admin Examples</h2>
    </div>
    <div class="column-12">
      <h4>Item, Protected</h4>
      <arcgis-hub-delete-confirmation id="p-proj-o" ></arcgis-hub-delete-confirmation>
    </div>
    <div class="column-12">
      <h4>Group, Protected</h4>
      <arcgis-hub-delete-confirmation id="p-group-o" ></arcgis-hub-delete-confirmation>
    </div>
    <div class="column-12">
      <h4>Item, Not Protected</h4>
      <arcgis-hub-delete-confirmation id="proj-o" ></arcgis-hub-delete-confirmation>
    </div>
    <div class="column-12">
      <h4>Group, Not Protected</h4>
      <arcgis-hub-delete-confirmation id="group-o" ></arcgis-hub-delete-confirmation>
    </div>
    <div class="column-12">
      <h4>Item, Not Protected, Can Recycle</h4>
      <arcgis-hub-delete-confirmation id="proj-o-r" ></arcgis-hub-delete-confirmation>
    </div>
  </div>

  <script >
    // import { createHubGroup, createProject} from 'https://cdn.skypack.dev/@esri/hub-common';
    const config = [
      {
        control: "p-proj-no",
        entity: {
          type: "Hub Project",
          protected: true,
          id: "fake-id-success",
          canDelete: false,
          canEdit: false,
        }
      },
      {
        control: "p-proj-o",
        entity: {
          type: "Hub Project",
          protected: true,
          id: "fake-id-success",
          canDelete: true,
          canEdit: true,
        }
      },
      {
        control: "proj-no",
        entity: {
          type: "Hub Project",
          protected: false,
          id: "fake-id-success",
          canDelete: false,
          canEdit: false,
        }
      },
      {
        control: "proj-o",
        entity: {
          type: "Hub Project",
          protected: false,
          id: "fake-id-success",
          canDelete: true,
          canEdit: true,
        }
      },

      {
        control: "proj-o-r",
        entity: {
          type: "Web Map",
          owner: "paige_pa",
          protected: false,
          id: "ac0f7054107043bba186ed83c1c01bf7", // DEVEXT
          canDelete: true,
          canEdit: true,

        }
      },
       {
        control: "p-group-o",
        entity: {
          type: "Group",
          protected: true,
          id: "fake-id-success",
          canDelete: true,
          canEdit: true,

        }
      },
      {
        control: "group-o",
        entity: {
          type: "Group",
          protected: false,
          id: "fake-id-success",
          canDelete: true,
          canEdit: true,

        }
      }
    ];

    config.forEach((c) => {
      const control = document.querySelector(`#${c.control}`);
      if (control) {
        control.entity = c.entity;
      }
    });

  </script>
</body>

</html>
