<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>Hub Components: Simple Gallery</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
  </style>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
  <link rel="stylesheet"
    href="../calcite-web.min.css">
</head>

<body>
  <div class="grid-container padding-leader-2">
    <div class="column-20 trailer-2 header">

      <calcite-button scale="l" href="/">Home</calcite-button>
      <h2>hub-download-card</h2>
    </div>
    <div>
      <calcite-notice open kind="danger" scale="l" width="half" icon>
        <div slot="title">DEPRECATED</div>
        <div slot="message">Use "arcgis-hub-download-list" instead. This component will be removed once the new component is fully tested and ready for production.</div>
      </calcite-notice>
    </div>
    <div class="column-10">
      <hub-download-card
        host="https://opendataqa.arcgis.com"
        name="test"
        dataset-id="440483039c624f3d9c3a16411c089ff7_27"
        format="CSV"
        >
      </hub-download-card>
    </div>
    <div class="column-10">
      <hub-download-card lang="zh-cn"
        host="https://opendataqa.arcgis.com"
        name="test"
        dataset-id="440483039c624f3d9c3a16411c089ff7_27"
        format="CSV"
        >
      </hub-download-card>
    </div>
  </div>
</body>

</html>
