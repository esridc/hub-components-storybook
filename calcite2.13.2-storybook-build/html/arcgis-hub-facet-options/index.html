<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arcgis-hub-facet-options</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
  </style>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
  <link rel="stylesheet" href="../calcite-web.min.css">

  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>

  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <script type="module" src="../../calcite/calcite.esm.js"></script>
</head>

<body>
  <div class="grid-container padding-leader-2">
    <div class="column-20 trailer-2 header">
      <calcite-button scale="l" href="/">Home</calcite-button>
      <h2>arcgis-hub-facet-options</h2>
    </div>

    <div class="column-20">
      <arcgis-hub-facet-options id="arcgis-hub-facet-options-harness">
      </arcgis-hub-facet-options>
    </div>
  </div>

  <script>
    // set a property on the element
    function setProp(key, value) {
      const el = document.querySelector("#arcgis-hub-facet-options-harness");
      el[key] = value;
    }
    const sampleFacet = {
        label: "From",
        key: "from",
        display: "single-select",
        pageSize: 3,
        accordionClosed: true,
        options: [
          {
            label: "Esri",
            key: "esri",
            selected: true,
            filter: {
              filterType: "content",
              owner: "esri",
            },
          },
          {
            label: "Anyone",
            key: "anyone",
            selected: false,
            filter: {
              filterType: "content",
              access: "public",
            },
          },
        ],

      };
    setProp("facet", sampleFacet);
  </script>
</body>

</html>
