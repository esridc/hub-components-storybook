<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Hub Components: Discussions Map Preview</title>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      calcite-notice {
        margin-top: 4rem;
      }

      .posts {
        background-color: gray;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        column-gap: 0.5rem;
        row-gap: 0.5rem;
        padding: 0.5rem;
        height: calc(100vh - 5rem);
      }

      .post {
        background-color: #fff;
        position: relative;
        height: calc(100% - 1rem);
        overflow: auto;
        padding: 0.5rem;
      }

      .post h5 {
        font-size: 16px;
        margin: 0;
        padding: 5px;
        position: absolute;
        top: 0;
        right: 0;
        z-index: 401;
        background-color: #eee;
        border: solid 1px #666;
        border-radius: 0 0 0 5px;
        opacity: 0.5;
      }
    </style>
    <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
    <script type="importmap">
      {
        "imports": {
          "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
        }
      }
    </script>
    <script type="module" src="../../build/hub-components.esm.js"></script>
    <script nomodule src="../../build/hub-components.js"></script>
    <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
    <link rel="stylesheet" href="../calcite-web.min.css" />
  </head>
  <body>
    <script src="https://unpkg.com/@esri/arcgis-rest-request@3.4.3/dist/umd/request.umd.min.js"></script>
    <script src="https://unpkg.com/@esri/arcgis-rest-auth@3.4.3/dist/umd/auth.umd.min.js"></script>
    <harness-header page-title="Discussion Map Preview"></harness-header>
    <calcite-notice open kind="info" scale="s" width="full" icon>
      <div slot="message">This component requires authentication to render. Please auth as juliana_pa on QA.</div>
    </calcite-notice>
    <div class="posts">
      <div class="post">
        <h5>Map Preview</h5>
        <arcgis-hub-discussions-map-preview
          post-id='47c71e5f-7340-49fb-a24c-0e68211e8ddc'
          channel-id='0bf5a3d8-cac5-4a71-9cf5-61613a1c59c5'
          discussion='hub://content/af97b44f8dbb4cabb8d4d00d22418ace'></arcgis-hub-discussions-map-preview>
      </div>
      <div class="post">
        <h5>Map Preview (with Channel Avatar)</h5>
        <arcgis-hub-discussions-map-preview
          post-id='47c71e5f-7340-49fb-a24c-0e68211e8ddc'
          channel-id='0bf5a3d8-cac5-4a71-9cf5-61613a1c59c5'
          discussion='hub://content/af97b44f8dbb4cabb8d4d00d22418ace'
          show-channel-avatar></arcgis-hub-discussions-map-preview>
      </div>
    </div>
  </body>
</html>
