<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arcgis-hub-timeline-editor</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
  </style>

  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
  <link rel="stylesheet" href="../calcite-web.min.css">
</head>

<body>
  <div class="grid-container padding-leader-2">
    <div class="column-20 trailer-2 header">
      <calcite-button scale="l" href="/">Home</calcite-button>
      <h2>arcgis-hub-timeline-editor</h2>
    </div>


    <arcgis-hub-timeline-editor class="column-16" id="arcgis-hub-timeline-editor-harness">
    </arcgis-hub-timeline-editor>

    <arcgis-hub-timeline class="column-8">
    </arcgis-hub-timeline>
  </div>

  <script>
    const timelinePojo = {
      schemaVersion: 1,
      "title":"The Project We Need",
      "description":"We Promise to Listen to You!!",
      "stages": [
        {
          "title": "Discuss It Quickly!",
          "timeframe": "March 3rd, 2022",
          "stageDescription": "It is important that we do this now, in terms of one thing and another",
          "link": {
            "href": "https://google.com",
            "title": "Click here for more information"
          },
          "status": "notStarted",
          "key": "stage1",
        },
        {
          "title": "Build It",
          "timeframe": "07.23.2021",
          "stageDescription": "This is a 5 point endeavor, here is how the endeavor will be built while we are building it",
          "status": "inProgress",
          "key": "stage2",
        },
        {
          "title": "Ship It",
          "timeframe": "Winter Solstice",
          "stageDescription": "Enemy should not be the perfect of good",
          "link": {
            "href": "https://some-project.com"
          },
          "status": "skipped",
          "key": "stage3"
        },
        {
          "title": "Measure It",
          "timeframe": "The First of January",
          "stageDescription": "We did good work, in my opinion",
          "status": "complete",
          "key": "stage4"
        }
      ]
    }
    const cardEditor = document.getElementById('arcgis-hub-timeline-editor-harness');
    cardEditor.values = timelinePojo;

    const card = document.querySelector('arcgis-hub-timeline');
    card.timelineTitle = timelinePojo.title;
    card.description = timelinePojo.description;
    card.stages = timelinePojo.stages;

    cardEditor.addEventListener('arcgisHubTimelineEditorChange', (evt) => {
      console.info('arcgisHubTimelineEditorChange:', evt.detail);
      if (evt.detail.valid) {
        updateValues(evt.detail.values);
      }
    });

    function updateValues (values) {
      const timeline = document.querySelector('arcgis-hub-timeline');
      Object.entries(values).forEach(([key, value]) => {
        if (key === 'title') {
          timeline['timelineTitle'] = value;
        } else {
          timeline[key] = value;
        }
      });
    }
  </script>
</body>

</html>
