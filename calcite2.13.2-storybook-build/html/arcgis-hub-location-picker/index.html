<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arcgis-hub-location-picker</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
  </style>

  <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>

  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
  <link rel="stylesheet" href="../calcite-web.min.css">
</head>

<body>
  <div class="grid-container padding-leader-2">
    <!-- docs about grid container: https://esri.github.io/calcite-web/documentation/grid/#grid -->
    <div class="column-24 trailer-2 header">
      <calcite-button scale="l" href="/">Home</calcite-button>
      <h2>arcgis-hub-location-picker</h2>
    </div>

    <div class="column-24">
      <arcgis-hub-location-picker id="arcgis-hub-location-picker-harness" />
    </div>
  </div>

  <script>
    const options = [
      {
        label: "No Location",
        // selected: true,
        location: {
          type: "none",
        }
      },
      {
        label: "Organization's Extent",
        description: "City of X",
        // selected: true,
        location: {
          type: "org",
          extent: [[-88, 39.1], [-87.10000000000001, 40]],
          spatialReference: {
            wkid: 4326
          }
        }
      },
      // {
      //   label: "Custom",
      //   description: "Draw one or more locations",
      //   selected: true,
      //   location: {
      //     type: "custom",
      //     extent: [[-88, 39.1], [-87.10000000000001, 40]],
      //     geometries: [{
      //       type: 'extent',
      //       spatialReference: {
      //           wkid: 4326
      //       },
      //       xmin: -88,
      //       ymin: 39.1,
      //       xmax: -87.10000000000001,
      //       ymax: 40

      //     }],
      //     spatialReference: {
      //       wkid: 4326
      //     }
      //   }
      // },
      {
        selected: true,
        "label": "custom",
        "description": "This is a custom location",
        "location": {
            "type": "custom",
            "extent": [
                [
                    -109.13673818111646,
                    30.883694004275508
                ],
                [
                    -85.06809651852515,
                    41.749484513528024
                ]
            ],
            "spatialReference": {
                "wkid": 4326
            },
            "geometries": [
              {
                type: "point",
                  "spatialReference": {
                      "wkid": 4326
                  },
                  "x": -94.60243225098269,
                  "y": 38.92877848547462
              },
              {
                type: "point",
                  "spatialReference": {
                      "wkid": 4326
                  },
                  "x": -90.04048287869233,
                  "y": 38.55651184751446
              },
              {
                type: "point",
                  "spatialReference": {
                      "wkid": 4326
                  },
                  "x": -89.69154357910898,
                  "y": 34.84553433799324
              },
              {
                type: "point",
                  "spatialReference": {
                      "wkid": 4326
                  },
                  "x": -97.67407655716474,
                  "y": 35.47892222110322
              }
            ]
        }
      }
    ];
    const extent = {
  "xmin": -88,
  "ymin": 39.1,
  "xmax": -87.10000000000001,
  "ymax": 40,
  "type": "extent",
  "spatialReference": {
    "wkid": 4326
  }
}
    // set a property on the element
    function setProp(key, value) {
      const el = document.querySelector("arcgis-hub-location-picker");
      el[key] = value;
    }
    setProp("options", options);
    setProp("extent", extent);

    const el = document.querySelector("arcgis-hub-location-picker");
    el.addEventListener("arcgisHubLocationPickerUpdate", (e) => {
      console.log("arcgisHubLocationPickerUpdate", e.detail);
    });
  </script>
</body>

</html>
