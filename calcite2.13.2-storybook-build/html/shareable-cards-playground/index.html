<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>Hub Components: Shareable Cards</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
  </style>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
  <link rel="stylesheet" href="../calcite-web.min.css">
</head>

<body>
  <div class="grid-container padding-leader-2">
    <div class="column-24 trailer-2 header">
      <calcite-button scale="l" href="/">Home</calcite-button>
      <h2>shareable cards</h2>
    </div>
  </div>

  <div class="grid-container padding-leader-2">

  </div>

  <div class="grid-container padding-leader-2">
    <arcgis-stat-card class="column-6" corners="rounded" id="stat-card-1" value="1" shareable card-title="Red..."><span slot="footer">foothebar</span></arcgis-stat-card>
    <arcgis-stat-card class="column-6" corners="rounded" id="stat-card-2" value="2" shareable shareable-on-hover card-title="Five..."><span slot="footer">foothebar</span></arcgis-stat-card>
    <arcgis-stat-card class="column-6" id="stat-card-3" value="3" shareable shareable-by-value card-title="Jupe..."><span slot="footer">foothebar</span></arcgis-stat-card>
    <arcgis-stat-card class="column-6" corners="rounded" id="stat-card-4" value="4" shareable shareable-by-value shareable-on-hover card-title="Dave..."><span slot="footer">foothebar</span></arcgis-stat-card>
  </div>

  <div class="grid-container padding-leader-2">
    <div class="column-12">
      <arcgis-shareable-card shareable>
        <arcgis-countdown id="mira-countdown" card-title="Mira's Birthday" countdown-date="2022-10-30"></arcgis-countdown>
      </arcgis-shareable-card>
    </div>

    <div class="column-12">
      <arcgis-shareable-card shareable shareable-by-value shareable-on-hover>
        <arcgis-countdown id="riley-countdown" card-title="Riley's birthday" countdown-date="2022-08-07"></arcgis-countdown>
      </arcgis-shareable-card>
    </div>
  </div>
</body>

</html>
