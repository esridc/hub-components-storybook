<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuration Editor</title>

  <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>

  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>

  <link href="../../jsoneditor/jsoneditor.min.css" rel="stylesheet" type="text/css">
  <script src="../../jsoneditor/jsoneditor.min.js"></script>

  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
  <script type="module" src="../../calcite/calcite.esm.js"></script>
  <link rel="stylesheet" href="../calcite-web.min.css">

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }

    .editors-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr auto;
      /* grid-template-areas:
                           "s u"
                           "t v"
                           "b b"; */
      gap: 1rem;
    }

    .jsoneditor {
      height: 300px;
    }

    #apply-schemas {
      grid-column: span 2;
    }

    .editor-container > label {
      font-weight: bold;
      margin: 0 0 0.25rem 0;
    }

    .jsoneditor-tree table {
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <harness-header page-title="Configuration Editor Playground"></harness-header>
  <div class="grid-container padding-leader-4">
    <div class="column-24 trailer-2 header">
      <div>
        <calcite-button round appearance="outline" scale="m" href="./index.html" icon-start="chevron-left">Back to Configuration Editor Suite</calcite-button>
      </div>
    </div>

    <!-- CONFIGURATION EDITOR CONTAINER -->
    <div class="column-24 trailer-1 editors-container">
      <div id="schema-editor-container" class="editor-container">
        <label for="schema">Schema</label>
        <div id="schema" name="schema"></div>
      </div>

      <div id="ui-schema-editor-container" class="editor-container">
        <label for="ui-schema">UI Schema</label>
        <div id="ui-schema" name="ui-schema"></div>
      </div>

      <div id="translations-editor-container" class="editor-container">
        <label for="translations">Translations</label>
        <div id="translations" name="translations"></div>
      </div>

      <div id="values-editor-container" class="editor-container">
        <label for="values">Values</label>
        <div id="values" name="values"></div>
      </div>

      <calcite-button id="apply-schemas">Apply</calcite-button>
    </div>
    <h3>Results:</h3>
    <div class="column-24" id="editor-container"></div>
  </div>

  <script>
    let editor;
    let context;
    let schemaEditor;
    let uiSchemaEditor;
    let valuesEditor;
    let translationsEditor;

    const getProp = (obj, path) => {
      return path.split(".").reduce(function (prev, curr) {
        return prev ? prev[curr] : undefined;
      }, obj);
    }

    const initInputs = async () => {
      const { SCHEMA, UI_SCHEMA, VALUES, TRANSLATIONS = {} } = await import(`./schemas/editor-playground.js`);
      const editorOpts = { modes: ['code', 'tree'], search: false, navigationBar: false, enableSort: false, enableTransform: false };
      schemaEditor = new JSONEditor(document.getElementById('schema'), editorOpts, SCHEMA);
      uiSchemaEditor = new JSONEditor(document.getElementById('ui-schema'), editorOpts, UI_SCHEMA);

      valuesEditor = new JSONEditor(document.getElementById('values'), editorOpts, VALUES);
      translationsEditor = new JSONEditor(document.getElementById('translations'), editorOpts, TRANSLATIONS);
    }

    const applySchemas = () => {
      const schema = schemaEditor.get();
      const uiSchema = uiSchemaEditor.get();

      const values = valuesEditor.get();
      const translations = translationsEditor.get();
      const translationFunc = (key) => getProp(translations, key);

      editor && editor.remove();

      editor = document.createElement('arcgis-configuration-editor')
      editor.schema = schema;
      editor.uiSchema = uiSchema;
      editor.values = values;
      editor.t = translationFunc;
      editor.context = context;

      const container = document.getElementById('editor-container');
      container.appendChild(editor);
    }

    const init = async () => {
      await initInputs();
      applySchemas();
      document.getElementById('apply-schemas').addEventListener('click', applySchemas);
    }

    init();

    // CONFIGURATION EDITOR EVENT LISTENERS (logged to console for development purposes)
    document.addEventListener('arcgisConfigurationEditorInitialized', evt => {
      console.info('arcgisConfigurationEditorInitialized', evt.detail);
    });
    document.addEventListener('arcgisConfigurationEditorLoaded', evt => {
      console.info('arcgisConfigurationEditorLoaded');
    });
    document.addEventListener('arcgisConfigurationEditorChange', evt => {
      console.info('arcgisConfigurationEditorChange', evt.detail);
    });

    // AUTH FUNCTIONALITY - needed for the gallery picker field
    // TODO: this can go away when arcgis-configuration-editor gets context from stencil store
    document.addEventListener('arcgisAppIdentitySignedIn', (evt) => {
      context = evt.detail;
      if (editor) { editor.context = evt.detail; }
    });
    document.addEventListener('arcgisAppIdentitySignedOut', (evt) => {
      context = evt.detail;
      if (editor) { editor.context = evt.detail; }
    });
  </script>
</body>

</html>
