<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog Examples</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
  </style>

  <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>
  <!-- load chart components -->
  <!-- NOTE: you will need to add this to any story that uses arcgis-hub-chart -->
  <link href="../../jsoneditor/jsoneditor.min.css" rel="stylesheet" type="text/css">
  <script src="../../jsoneditor/jsoneditor.min.js"></script>
  <link rel="stylesheet" href="../../arcgis-charts-components/arcgis-charts-components.css" />
  <script type="module" src="../../arcgis-charts-components/arcgis-charts-components.esm.js"></script>
  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
  <script type="module" src="../../calcite/calcite.esm.js"></script>
  <link rel="stylesheet" href="../calcite-web.min.css" />
</head>

<body>
  <harness-header page-title="Entity View Harness"></harness-header>
  <div class="grid-container padding-leader-4">
    <div class="padding-trailer-2">
      <calcite-combobox id="harness-combobox" selection-mode="single">
        <calcite-combobox-item value="scenario1" text-label="Scenario 1: catalog has no scopes + no collections"></calcite-combobox-item>
        <calcite-combobox-item value="scenario2" text-label="Scenario 2: catalog has empty scopes + no collections"></calcite-combobox-item>
        <calcite-combobox-item value="scenario3" text-label="Scenario 3: catalog has no scopes + empty collections"></calcite-combobox-item>
        <calcite-combobox-item value="scenario4" text-label="Scenario 4: catalog has empty scopes + empty collections "></calcite-combobox-item>
        <calcite-combobox-item value="scenario5" text-label="Scenario 5: catalog has scopes + no collections"></calcite-combobox-item>
        <calcite-combobox-item value="scenario6" text-label="Scenario 6: catalog has no scopes + collections"></calcite-combobox-item>
        <calcite-combobox-item value="scenario7" text-label="Scenario 7: catalog has scopes + collections"></calcite-combobox-item>
      </calcite-combobox>
    </div>

    <div class="padding-trailer-2">
      <calcite-block collapsible heading="Catalog definition">
        <div id="harness-catalog-code-snippet"></div>
      </calcite-block>
    </div>

    <arcgis-hub-catalog
      id="harness-catalog"
      linkTarget="siteRelative"
      showAddContent
      showSearch
      showThumbnail />
  </div>

  <script type="module">
    import { scenario1, scenario2, scenario3, scenario4, scenario5, scenario6, scenario7, facets } from './fixtures.js';

    // INITIALIZE THE HARNESS ON LOAD
    const initHarness = () => {
      const catalogMap = {
        "scenario1": scenario1,
        "scenario2": scenario2,
        "scenario3": scenario3,
        "scenario4": scenario4,
        "scenario5": scenario5,
        "scenario6": scenario6,
        "scenario7": scenario7
      }

      // 1. get the entity query params from the URL
      const params = new URL(window.location).searchParams;
      const scenario = params.get('scenario') || 'scenario3';

      // 2. update the combobox selection
      const harnessComboboxItems = document.querySelectorAll('#harness-combobox > calcite-combobox-item');
      harnessComboboxItems.forEach(item => {
        if(item.value === scenario) {
          item.selected = true;
        } else {
          item.selected = false;
        }
      })

      // 3. update the catalog definition
      const catalogEl = document.getElementById('harness-catalog');
      setProp(catalogEl, 'catalogs', catalogMap[scenario]);

      // 4. set various catalog props
      setProp(catalogEl, "facets", facets)
      setProp(catalogEl, "showSearch", true);

      // 5. update the catalog code sample
      const editorOpts = { modes: ['code', 'tree'], search: false, navigationBar: false, enableSort: false, enableTransform: false };
      new JSONEditor(document.getElementById('harness-catalog-code-snippet'), editorOpts, catalogMap[scenario]);
    }

    initHarness();

    // HELPER TO SET PROPS ON PROVIDED CATALOG
    function setProp(el, key, value) {
      el[key] = value;
    }

    // CALCITE COMBOBOX CHANGE LISTENER - to re-initialize the selected catalog
    document.addEventListener('calciteComboboxChange', evt => {
      const { value, id } = evt.target;
      if (id === "harness-combobox") {
        appendParams({ scenario: value });
      }
    });

    // HELPER TO APPEND TYPE + IDENTIFIER AS QUERY PARAMS ON URL
    const appendParams = (params) => {
      const url = new URL(window.location);

      Object.entries(params).forEach(([key, value]) => {
        url.searchParams.set(key, value);
      });
      window.location.search = url.search;
    }
  </script>
</body>

</html>
