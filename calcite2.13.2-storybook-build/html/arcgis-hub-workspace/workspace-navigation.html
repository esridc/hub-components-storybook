<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Navigation Harness</title>

    <style>
      .header {
        display: flex;
        justify-content: space-between;
      }
    </style>

    <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
        }
      }
    </script>
    <script type="module" src="../../build/hub-components.esm.js"></script>
    <script nomodule src="../../build/hub-components.js"></script>
    <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
    <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
    <link rel="stylesheet" href="../calcite-web.min.css">
  </head>

  <body>
    <harness-header page-title="Workspace Navigation Harness"></harness-header>
    <div class="grid-container padding-leader-4">

      <!-- WORKSPACE HARNESS NAVIGATION -->
      <div class="column-24 trailer-2">
        <calcite-dropdown id="harness-dropdown">
          <calcite-button appearance="outline" icon-end="caret-down" slot="trigger">Select a Workspace
            Harness</calcite-button>
          <calcite-dropdown-group group-title="Entity Workspaces">
            <calcite-dropdown-item href="./entity-workspace-harness.html?type=project">Project Workspace</calcite-dropdown-item>
            <calcite-dropdown-item href="./entity-workspace-harness.html?type=site">Site Workspace</calcite-dropdown-item>
            <calcite-dropdown-item href="./entity-workspace-harness.html?type=initiative">Initiative Workspace</calcite-dropdown-item>
            <calcite-dropdown-item href="./entity-workspace-harness.html?type=discussion">Discussion Workspace</calcite-dropdown-item>
            <calcite-dropdown-item href="./entity-workspace-harness.html?type=content">Content Workspace</calcite-dropdown-item>
            <calcite-dropdown-item href="./entity-workspace-harness.html?type=group">Group Workspace</calcite-dropdown-item>
            <calcite-dropdown-item href="./entity-workspace-harness.html?type=page">Page Workspace</calcite-dropdown-item>
          </calcite-dropdown-group>
          <calcite-dropdown-group group-title="Sub-components">
            <calcite-dropdown-item href="./workspace-header.html">Workspace Header</calcite-dropdown-item>
            <calcite-dropdown-item href="./workspace-panel.html">Workspace Pane</calcite-dropdown-item>
            <calcite-dropdown-item selected href="./workspace-navigation.html">Workspace Navigation</calcite-dropdown-item>
            <calcite-dropdown-item href="./workspace-navigation-slotted.html">Workspace Navigation - Slotted</calcite-dropdown-item>
            <calcite-dropdown-item href="./workspace-link.html">Workspace Link</calcite-dropdown-item>
            <calcite-dropdown-item href="./workspace-dirty-state-modal.html">Workspace Dirty State Modal</calcite-dropdown-item>
          </calcite-dropdown-group>
        </calcite-dropdown>
      </div>

      <!-- WORKSPACE NAVIGATION -->
      <div class="column-6">
        <div id="harness-placeholder"></div>
      </div>

    <script>
      const mockEntity = {
        id: '320d5995b77c4e2eae27c85faa75e1e2',
        type: 'Hub Project',
        canEdit: true,
        capabilities: []
      }

      function setProp(key, value) {
        const el = document.querySelector("#arcgis-hub-workspace-harness");
        el[key] = value;
      }

      // LISTEN FOR WORKSPACE LINK CLICKS: for development purposes,
      // we need to prevent redirects
      document.addEventListener('arcgisHubWorkspaceLinkClicked', evt => {
        const { clickEvent, panel } = evt.detail;

        clickEvent.preventDefault();
        setProp('activePanel', panel);

        console.info('arcgisHubWorkspaceLinkClicked', evt.detail)
      })

      // AUTH FUNCTIONALITY
      // TODO: this can go away when arcgis-hub-workspace-header gets context from stencil store
      document.addEventListener('arcgisAppIdentitySignedIn', (evt) => {
        const context = evt.detail;

        // add workspace navigation component to DOM after context is received
        // to avoid having to "Watch" context just for harness purposes
        const workspaceNavigation = document.createElement('arcgis-hub-workspace-navigation')
        const placehoder = document.getElementById('harness-placeholder');
        workspaceNavigation.id = 'arcgis-hub-workspace-harness';
        placehoder.appendChild(workspaceNavigation);

        setProp('context', context);
        setProp('entity', mockEntity);
      });
      document.addEventListener('arcgisAppIdentitySignedOut', (evt) => {
        setProp('context', evt.detail);
      });
    </script>
  </body>
</html>
