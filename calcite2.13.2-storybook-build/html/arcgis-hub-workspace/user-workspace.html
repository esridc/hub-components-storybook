<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Workspace</title>

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }

    calcite-notice {
      width: 500px;
      margin: 5rem auto;
    }
  </style>

  <!-- NOTE: Tom says this should not be needed but i found that things blew up when i brought in `interpolateTranslations` and this fixed it -->
  <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.2/dist/es-module-shims.js"></script>
  <script type="importmap">
      {
        "imports": {
          "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
        }
      }
    </script>
  <!-- load chart components -->
  <!-- NOTE: you will need to add this to any story that uses arcgis-hub-chart -->
  <link rel="stylesheet" href="../../arcgis-charts-components/arcgis-charts-components.css" />
  <script type="module" src="../../arcgis-charts-components/arcgis-charts-components.esm.js"></script>
  <script type="module" src="../../build/hub-components.esm.js"></script>
  <script nomodule src="../../build/hub-components.js"></script>
  <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
  <script type="module" src="../../calcite/calcite.esm.js"></script>
  <link rel="stylesheet" href="../calcite-web.min.css" />
</head>

<body>
  <harness-header page-title="User Workspace"></harness-header>
  <div id="content">

    <calcite-notice id="sign-in-message" open icon="user">
      <div slot="title">Sign in</div>
      <div slot="message">Sign in to view your workspace</div>
    </calcite-notice>

  </div>

  <script>

  // inject flags onto the header
  const header = document.querySelector('harness-header');
  header.flags = {
    'hub:feature:workspace': true,
    'hub:user:workspace': true,
    'hub:user:workspace:overview': true,
    'hub:user:workspace:content': true,
    'hub:user:workspace:groups': true,
    'hub:user:workspace:settings': true,
  };

    // if user is not authenticated, we show a please sign in message

    // if they are signed in, we add the user workspace

    // event handlers for arcgisAppIdentitySignedIn and arcgisAppIdentitySignedOut
          document.addEventListener('arcgisAppIdentitySignedIn', evt => {
      // remove the sign in message if it exists
      const message = document.querySelector('#sign-in-message');
      message.style.display = 'none';
      const header = document.querySelector('harness-header');
      header.style.display = 'none';
      // if the workspce is already there, we don't add it again
      if (document.querySelector('#user-workspace')) {
        return;
      }
      // if user is signed in, we add the user workspace
      const workspace = document.createElement('arcgis-hub-workspace');
      workspace.id = 'user-workspace';
      workspace.setAttribute('identifier', 'self');
      workspace.setAttribute('type', 'user');
      workspace.setAttribute('pane', 'overview');
      document.querySelector('#content').appendChild(workspace);
    });

    document.addEventListener('arcgisAppIdentitySignedOut', evt => {

      // rmeove the user workspace if it exists
      const workspace = document.querySelector('#user-workspace');
      if (workspace) {
        workspace.remove();
      }
      // if user is signed out, we show a please sign in message
      const message = document.querySelector('#sign-in-message');
      message.style.display = 'block';
      const header = document.querySelector('harness-header');
      header.style.display = 'block';
    });


    document.addEventListener('arcgisHubWorkspaceSignOut', _ => {
      const evt = new CustomEvent('arcgisAppIdentityStartSignOut');
      document.dispatchEvent(evt);
    });

    document.body.addEventListener('hubTelemetry', function (evt) {
      console.log('hubTelemetry:', evt.detail);
    });

  </script>
</body>

</html>
