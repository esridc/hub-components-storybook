<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arcgis-hub-user-profile</title>

  <!-- link to calcite components CSS  -->
  <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />

  <!-- NOTE: calcite web CSS is only used for grid layout of this page -->
  <!-- see: https://esri.github.io/calcite-web/documentation/grid/#grid -->
  <link rel="stylesheet" href="../calcite-web.min.css" />

  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
      }
    }
  </script>

  <!-- load calcite components -->
  <script type="module" src="../../calcite/calcite.esm.js"></script>

  <!-- load hub components -->
  <script type="module" src="../../build/hub-components.esm.js"></script>
</head>

<body>
  <harness-header page-title=arcgis-hub-user-profile></harness-header>
  <div class="grid-container padding-leader-4">
    <!-- docs about grid container: https://esri.github.io/calcite-web/documentation/grid/#grid -->

    <div class="column-24 trailer-2">
      <arcgis-hub-user-profile variant="minimal"></arcgis-hub-user-profile>
    </div>

    <div class="column-24">
      <arcgis-hub-user-profile></arcgis-hub-user-profile>
    </div>
  </div>

  <script>
    document.querySelectorAll('arcgis-hub-user-profile').forEach(el => {
      el.addEventListener('arcgisHubUserProfileLinkClick', e => {
        const { clickEvent, href } = e.detail;
        // don't go there
        clickEvent.preventDefault();
        console.log('arcgisHubUserProfileLinkClick', { clickEvent, href });
      });
      el.addEventListener('arcgisHubUserProfileSignout', _ => {
        const evt = new CustomEvent('arcgisAppIdentityStartSignOut');
        document.dispatchEvent(evt);
      });
    });
  </script>
</body>

</html>
