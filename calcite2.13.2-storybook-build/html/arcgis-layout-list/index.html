<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Hub Components: Layout List</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        align-items: center;
      }

      div:not([slot='actions']) {
        border: 1px solid #666;
        align-items: center;
        text-align: center;
        padding: 1rem;
      }

      arcgis-layout-list {
        width: 100%;
        /* --arcgis-hub-layout-list-min-column-width: 30rem; */
        /* --arcgis-hub-layout-list-gap: 2rem; */
        /* --arcgis-hub-layout-list-actions-gap: 1rem; */
        /* --arcgis-hub-layout-list-actions-margin: 0.5rem; */
      }
    </style>
    <link rel="stylesheet" href="https://webapps-cdn.esri.com/CDN/fonts/v1.4.1/fonts.css" />
    <script type="module" src="../../build/hub-components.esm.js"></script>
    <script nomodule src="../../build/hub-components.js"></script>
    <link rel="stylesheet" href="../../calcite/calcite.css" />
  <link rel="stylesheet" href="../../build/hub-components.css" />
    <script type="module" src="../../calcite/calcite.esm.js"></script>
    <link rel="stylesheet" href="../calcite-web.min.css" />
  </head>
  <body>
    <arcgis-layout-list layout="grid" scale="s">
      <div slot="actions" style="display: flex; justify-content: end; flex-direction: row">
        <calcite-button>Click me</calcite-button>
      </div>
      <div role="listitem">one</div>
      <div role="listitem">two</div>
      <div role="listitem">three</div>
      <div role="listitem">four</div>
      <div role="listitem">five</div>
      <div role="listitem">six</div>
      <div role="listitem">seven</div>
      <div role="listitem">eight</div>
      <div role="listitem">nine</div>
    </arcgis-layout-list>
  </body>
</html>
